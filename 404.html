<script>
(function() {
  var path = window.location.pathname;
  var routes = {
    '/suplementos/magnesio': '/magnesio.html',
    '/suplementos/proteina': '/proteina.html',
    '/suplementos/Proteina': '/proteina.html',
    '/suplementos/creatina': '/creatina.html'
  };
  if (routes[path]) {
    window.location.replace(routes[path]);
    return;
  }
  if (/^\/suplementos\//i.test(path)) {
    sessionStorage.setItem('suplementos_redirect_path', path);
    window.location.replace('/suplementos.html');
  }
})();
</script>

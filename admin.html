<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — comparalo.mx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#006847;--g2:#004d34;
  --bg:#0f1117;--s:#1a1f2e;--s2:#242938;
  --t:#e2e8f0;--t2:#94a3b8;--bd:#2d3348;
  --amz:#f90;--ml:#f0c000;--red:#ef4444;--green:#22c55e;
  font-family:Inter,sans-serif
}
body{background:var(--bg);color:var(--t);min-height:100vh}

/* ─── Login ─────────────────────────────────────────── */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:40px 36px;width:360px;text-align:center}
.login-logo{width:48px;height:48px;background:var(--g);border-radius:10px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.login-box h1{font-size:1.3rem;font-weight:700;margin-bottom:4px}
.login-box p{color:var(--t2);font-size:.85rem;margin-bottom:24px}
.login-box input{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;color:var(--t);font-size:.9rem;margin-bottom:10px;transition:border .15s}
.login-box input:focus{outline:none;border-color:var(--g)}
.login-box button{width:100%;padding:11px;background:var(--g);border:none;border-radius:8px;color:#fff;font-weight:600;cursor:pointer;font-size:.95rem;transition:background .15s}
.login-box button:hover{background:var(--g2)}
.err{color:var(--red);font-size:.82rem;margin-top:10px;min-height:18px}

/* ─── Header ─────────────────────────────────────────── */
header{background:var(--s);border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.hdr-logo{width:28px;height:28px;background:var(--g);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.9rem}
header h1{font-size:.95rem;font-weight:700;flex:1}
#hdr-status{font-size:.78rem;padding:3px 10px;border-radius:20px;background:var(--s2);color:var(--t2)}
#hdr-status.ok{background:rgba(34,197,94,.15);color:var(--green)}
#hdr-status.saving{background:rgba(249,144,0,.15);color:var(--amz)}
#hdr-status.err{background:rgba(239,68,68,.15);color:var(--red)}
.btn-ghost{padding:6px 12px;background:none;border:1px solid var(--bd);border-radius:6px;color:var(--t2);cursor:pointer;font-size:.8rem;transition:all .15s}
.btn-ghost:hover{border-color:var(--g);color:var(--g)}

/* ─── Tabs ───────────────────────────────────────────── */
.tabs{display:flex;gap:2px;padding:14px 24px 0;border-bottom:1px solid var(--bd);background:var(--s);overflow-x:auto}
.tab{padding:8px 18px;border-radius:8px 8px 0 0;font-size:.83rem;font-weight:500;cursor:pointer;color:var(--t2);border:none;background:none;white-space:nowrap;transition:all .15s}
.tab:hover{color:var(--t)}
.tab.active{background:var(--bg);color:var(--t);box-shadow:0 0 0 1px var(--bd);border-bottom:1px solid var(--bg);margin-bottom:-1px}
.tab-cnt{opacity:.5;font-size:.72rem;margin-left:4px}

/* ─── Table ──────────────────────────────────────────── */
.section{padding:20px 24px}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-hdr span{font-size:.8rem;color:var(--t2)}
.search-wrap{position:relative}
.search-wrap input{padding:7px 12px 7px 30px;background:var(--s);border:1px solid var(--bd);border-radius:7px;color:var(--t);font-size:.82rem;width:220px}
.search-wrap input:focus{outline:none;border-color:var(--g)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--t2);font-size:.8rem;pointer-events:none}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 12px;font-size:.72rem;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--bd);white-space:nowrap}
tr.row{transition:background .1s}
tr.row:hover{background:var(--s)}
td{padding:10px 12px;border-bottom:1px solid rgba(45,51,72,.5);font-size:.84rem;vertical-align:middle}
td.img-cell img{width:46px;height:46px;object-fit:cover;border-radius:7px;display:block}
td.img-cell .no-img{width:46px;height:46px;background:var(--s2);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:.7rem}
td.price{font-weight:700;font-variant-numeric:tabular-nums}
td.stars{font-size:.8rem;color:var(--t2)}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:.68rem;font-weight:700;margin:1px}
.b-amz{background:var(--amz);color:#000}
.b-ml{background:var(--ml);color:#000}
.b-best{background:var(--green);color:#000}
.b-sale{background:#f43f5e;color:#fff}
.b-pop{background:#6366f1;color:#fff}
.btn-edit{padding:5px 12px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;color:var(--t);font-size:.78rem;cursor:pointer;transition:all .15s}
.btn-edit:hover{border-color:var(--g);color:var(--g)}

/* ─── Modal ──────────────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:24px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;position:relative}
.modal h2{font-size:.95rem;font-weight:700;margin-bottom:16px;padding-right:36px;line-height:1.4}
.modal-close{position:absolute;top:18px;right:18px;background:var(--s2);border:none;color:var(--t2);cursor:pointer;font-size:.9rem;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-close:hover{color:var(--t)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-full{grid-column:1/-1}
label{display:block;font-size:.72rem;font-weight:600;color:var(--t2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=number],select,textarea{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:7px;color:var(--t);font-size:.84rem;font-family:inherit;transition:border .15s}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{outline:none;border-color:var(--g)}
select option{background:var(--s)}
textarea{resize:vertical;min-height:72px;font-family:'JetBrains Mono',monospace;font-size:.78rem}
.field-hint{font-size:.7rem;color:var(--t2);margin-top:4px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:16px;border-top:1px solid var(--bd)}
.btn-cancel{padding:8px 16px;background:none;border:1px solid var(--bd);border-radius:7px;color:var(--t2);cursor:pointer;font-size:.85rem;transition:all .15s}
.btn-cancel:hover{border-color:var(--t2);color:var(--t)}
.btn-save{padding:8px 20px;background:var(--g);border:none;border-radius:7px;color:#fff;font-weight:600;cursor:pointer;font-size:.85rem;transition:background .15s;display:flex;align-items:center;gap:8px}
.btn-save:hover:not(:disabled){background:var(--g2)}
.btn-save:disabled{opacity:.5;cursor:not-allowed}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
.btn-save.loading .spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── Toast ──────────────────────────────────────────── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:12px 18px;font-size:.83rem;z-index:300;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;max-width:320px}
.toast.show{opacity:1;transform:none}
.toast.ok{border-color:var(--green);color:var(--green)}
.toast.err{border-color:var(--red);color:var(--red)}

/* ─── Empty ──────────────────────────────────────────── */
.empty{text-align:center;padding:60px 20px;color:var(--t2);font-size:.9rem}
</style>
</head>
<body>

<!-- ══ Login ═════════════════════════════════════════════ -->
<div id="login">
  <div class="login-box">
    <div class="login-logo">⚙</div>
    <h1>Admin Panel</h1>
    <p>comparalo.mx — acceso restringido</p>
    <input type="password" id="pwd" placeholder="Contraseña" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')doLogin()">
    <input type="password" id="ghtoken" placeholder="GitHub Token (ghp_...)"
           autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Entrar</button>
    <div class="err" id="login-err"></div>
    <div style="margin-top:14px;font-size:.73rem;color:var(--t2);line-height:1.5">
      El token no se guarda en el archivo.<br>Solo vive en tu navegador hasta que cierres sesión.
    </div>
  </div>
</div>

<!-- ══ Admin ══════════════════════════════════════════════ -->
<div id="admin" hidden>
  <header>
    <div class="hdr-logo">⚙</div>
    <h1>Admin — comparalo.mx</h1>
    <span id="hdr-status">Cargando...</span>
    <button class="btn-ghost" onclick="loadFile()">↺ Recargar</button>
    <button class="btn-ghost" onclick="doLogout()">Salir</button>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="section" id="section-content">
    <div class="empty">Cargando productos...</div>
  </div>
</div>

<!-- ══ Modal edición ══════════════════════════════════════ -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2 id="modal-title">Editar producto</h2>
    <div class="form-grid" id="modal-form"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" id="btn-save" onclick="saveEdit()">
        <span class="spinner" id="save-spinner"></span>
        <span id="save-label">Guardar en GitHub</span>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══ CONFIG ════════════════════════════════════════════════════
const CFG = {
  token:  '',
  owner:  'alancamachorespaldo-hue',
  repo:   'compara.mx',
  file:   'index.html',
  branch: 'main',
  pass:   'comparalo2025'
};

const SECS   = ['ELECTRICAS','MONTANA','RUTA','GRAVEL'];
const LABELS = {ELECTRICAS:'⚡ Eléctricas',MONTANA:'🏔 Montaña',RUTA:'🚴 Ruta',GRAVEL:'🪨 Gravel'};
const TIPOS  = ['plegable','urbana','mtb','ruta','gravel','otro'];

let rawContent = '', fileSha = '', products = {}, activeTab = 'ELECTRICAS', editProduct = null, query = '';

// ══ Autenticación ═════════════════════════════════════════════
function doLogin() {
  const p   = document.getElementById('pwd').value;
  const tok = document.getElementById('ghtoken').value.trim();
  if (p !== CFG.pass) {
    document.getElementById('login-err').textContent = 'Contraseña incorrecta';
    document.getElementById('pwd').select();
    return;
  }
  if (!tok) {
    document.getElementById('login-err').textContent = 'Ingresa tu GitHub Token (ghp_...)';
    document.getElementById('ghtoken').focus();
    return;
  }
  CFG.token = tok;
  sessionStorage.setItem('cmp_adm','1');
  sessionStorage.setItem('cmp_tok', tok);
  document.getElementById('login').hidden = true;
  document.getElementById('admin').hidden = false;
  loadFile();
}
function doLogout() {
  sessionStorage.removeItem('cmp_adm');
  sessionStorage.removeItem('cmp_tok');
  CFG.token = '';
  location.reload();
}
if (sessionStorage.getItem('cmp_adm')==='1' && sessionStorage.getItem('cmp_tok')) {
  CFG.token = sessionStorage.getItem('cmp_tok');
  document.getElementById('login').hidden = true;
  document.getElementById('admin').hidden = false;
  setTimeout(loadFile, 0);
}

// ══ GitHub API ════════════════════════════════════════════════
const GH_URL = () => `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.file}`;
const GH_HDR = () => ({
  Authorization: `token ${CFG.token}`,
  Accept: 'application/vnd.github.v3+json',
  'Content-Type': 'application/json'
});

async function ghGet() {
  const rawUrl  = `https://raw.githubusercontent.com/${CFG.owner}/${CFG.repo}/${CFG.branch}/${CFG.file}?t=${Date.now()}`;
  const metaUrl = `${GH_URL()}?ref=${CFG.branch}&t=${Date.now()}`;
  const [rawRes, metaRes] = await Promise.all([fetch(rawUrl), fetch(metaUrl)]);
  if (!rawRes.ok)  throw new Error(`No se pudo leer el archivo (${rawRes.status})`);
  if (!metaRes.ok) throw new Error(`Error al obtener SHA (${metaRes.status})`);
  const meta    = await metaRes.json();
  const content = await rawRes.text();
  return { content, sha: meta.sha };
}

async function ghPut(message) {
  const content = btoa(encodeURIComponent(rawContent).replace(/%([0-9A-F]{2})/g, (_, p) => String.fromCharCode(parseInt(p,16))));
  const r = await fetch(GH_URL(), {
    method: 'PUT',
    headers: GH_HDR(),
    body: JSON.stringify({ message, content, sha: fileSha, branch: CFG.branch })
  });
  if (!r.ok) { const d = await r.json(); throw new Error(d.message || r.status); }
  const data = await r.json();
  if (data.content?.sha) fileSha = data.content.sha;
  return true;
}

// ══ Carga y parse ═════════════════════════════════════════════
async function loadFile() {
  setStatus('Cargando...','');
  try {
    const data  = await ghGet();
    fileSha     = data.sha;
    rawContent  = data.content;
    parseAll();
    renderTabs();
    renderSection();
    setStatus('Listo ✓','ok');
  } catch(e) {
    setStatus('Error al cargar','err');
    toast(e.message,'err');
  }
}

function parseAll() {
  products = {};
  for (const sec of SECS) {
    const marker   = `const ${sec} = [`;
    const si       = rawContent.indexOf(marker);
    if (si === -1) { products[sec] = []; continue; }
    const arrStart = rawContent.indexOf('[', si) + 1;
    let depth = 1, i = arrStart;
    while (i < rawContent.length && depth > 0) {
      if (rawContent[i]==='[') depth++;
      else if (rawContent[i]===']') depth--;
      i++;
    }
    try {
      products[sec] = new Function('return [' + rawContent.slice(arrStart, i-1) + ']')();
    } catch(e) {
      products[sec] = [];
      console.error('Parse error:', sec, e);
    }
  }
}

// ══ Render ════════════════════════════════════════════════════
function renderTabs() {
  document.getElementById('tabs').innerHTML = SECS.map(s =>
    `<button class="tab${s===activeTab?' active':''}" onclick="switchTab('${s}')">
      ${LABELS[s]} <span class="tab-cnt">${(products[s]||[]).length}</span>
    </button>`
  ).join('');
}

function switchTab(sec) {
  activeTab = sec;
  query = '';
  renderTabs();
  renderSection();
}

function renderSection() {
  const all  = products[activeTab] || [];
  const list = query
    ? all.filter(p => (p.nombre+p.marca).toLowerCase().includes(query.toLowerCase()))
    : all;

  document.getElementById('section-content').innerHTML = `
    <div class="section-hdr">
      <span>${list.length} de ${all.length} productos</span>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Buscar..." value="${esc4html(query)}"
               oninput="query=this.value;renderSection()" autocomplete="off">
      </div>
    </div>
    <div class="table-wrap">
    <table>
      <thead><tr>
        <th></th><th>#</th><th>Nombre</th><th>Precio</th><th>★</th><th>Plataforma</th><th></th>
      </tr></thead>
      <tbody>
        ${list.length ? list.map(p => `
        <tr class="row">
          <td class="img-cell">
            ${p.img
              ? `<img src="${esc4html(p.img)}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=no-img>?</div>'">`
              : `<div class="no-img">?</div>`}
          </td>
          <td style="color:var(--t2);font-size:.72rem;font-family:'JetBrains Mono',monospace">${p.id}</td>
          <td>
            <div style="font-weight:500">${esc4html(p.nombre||'')}</div>
            <div style="color:var(--t2);font-size:.75rem;margin-top:2px">${esc4html(p.marca||'')} · ${p.tipo||''}</div>
          </td>
          <td class="price">$${(p.precio||0).toLocaleString('es-MX')}</td>
          <td class="stars">${p.estrellas||0}★<br><span style="font-size:.72rem">${(p.resenas||0).toLocaleString()} reseñas</span></td>
          <td>${renderBadges(p.badges||[])}</td>
          <td><button class="btn-edit" onclick="openEdit(${p.id})">Editar</button></td>
        </tr>`).join('') : `<tr><td colspan="7"><div class="empty">Sin resultados</div></td></tr>`}
      </tbody>
    </table>
    </div>`;
}

function renderBadges(badges) {
  return badges.map(b=>`<span class="badge ${esc4html(b.c)}">${esc4html(b.t)}</span>`).join('');
}

// ══ Modal ═════════════════════════════════════════════════════
function openEdit(id) {
  const p = (products[activeTab]||[]).find(x => x.id === id);
  if (!p) return;
  editProduct = JSON.parse(JSON.stringify(p));

  document.getElementById('modal-title').textContent = `Editar #${p.id} — ${p.nombre}`;
  document.getElementById('modal-form').innerHTML = `
    <div>
      <label>Precio ($)</label>
      <input type="number" id="f-precio" value="${p.precio||0}" min="0" step="1">
    </div>
    <div>
      <label>Tipo</label>
      <select id="f-tipo">${TIPOS.map(t=>`<option${p.tipo===t?' selected':''}>${t}</option>`).join('')}</select>
    </div>
    <div>
      <label>Estrellas (0–5)</label>
      <input type="number" id="f-stars" value="${p.estrellas||0}" min="0" max="5" step="0.1">
    </div>
    <div>
      <label>Reseñas</label>
      <input type="number" id="f-resenas" value="${p.resenas||0}" min="0">
    </div>
    <div class="form-full">
      <label>Nombre</label>
      <input type="text" id="f-nombre" value="${esc4html(p.nombre||'')}">
    </div>
    <div class="form-full">
      <label>Marca</label>
      <input type="text" id="f-marca" value="${esc4html(p.marca||'')}">
    </div>
    <div class="form-full">
      <label>Link Amazon <span style="font-weight:400;text-transform:none;font-size:.68rem">(incluir &amp;tag=comparabici-20)</span></label>
      <input type="text" id="f-lamz" value="${esc4html(p.linkAmz||'')}">
    </div>
    <div class="form-full">
      <label>Link Mercado Libre</label>
      <input type="text" id="f-lml" value="${esc4html(p.linkML||'')}">
    </div>
    <div class="form-full">
      <label>URL de imagen</label>
      <input type="text" id="f-img" value="${esc4html(p.img||'')}">
    </div>
    <div class="form-full">
      <label>Badges</label>
      <textarea id="f-badges">${(p.badges||[]).map(b=>`${b.t}|${b.c}`).join('\n')}</textarea>
      <div class="field-hint">Una por línea: <code>texto|clase</code> — clases: b-amz · b-ml · b-best · b-sale · b-pop</div>
    </div>`;

  document.getElementById('overlay').classList.add('open');
  document.getElementById('f-precio').focus();
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  editProduct = null;
}

async function saveEdit() {
  if (!editProduct) return;
  const btn   = document.getElementById('btn-save');
  const label = document.getElementById('save-label');

  editProduct.precio    = parseInt(document.getElementById('f-precio').value)||0;
  editProduct.tipo      = document.getElementById('f-tipo').value;
  editProduct.estrellas = parseFloat(document.getElementById('f-stars').value)||0;
  editProduct.resenas   = parseInt(document.getElementById('f-resenas').value)||0;
  editProduct.nombre    = document.getElementById('f-nombre').value.trim();
  editProduct.marca     = document.getElementById('f-marca').value.trim();
  editProduct.linkAmz   = document.getElementById('f-lamz').value.trim();
  editProduct.linkML    = document.getElementById('f-lml').value.trim();
  editProduct.img       = document.getElementById('f-img').value.trim();
  editProduct.badges    = document.getElementById('f-badges').value.trim().split('\n').filter(Boolean)
    .map(l => { const [t,c] = l.split('|'); return { t:(t||'').trim(), c:(c||'').trim() }; })
    .filter(b => b.t && b.c);

  if (!updateRaw(editProduct)) return;

  const sec = products[activeTab];
  const idx = sec.findIndex(x => x.id === editProduct.id);
  if (idx >= 0) sec[idx] = { ...editProduct };

  btn.disabled = true;
  btn.classList.add('loading');
  label.textContent = 'Guardando...';

  try {
    await ghPut(`admin: actualizado id${editProduct.id} ${editProduct.nombre}`);
    closeModal();
    renderSection();
    setStatus('Guardado ✓ — sitio actualizando en ~30s','ok');
    toast('¡Guardado! El sitio se actualiza en ~30 segundos.','ok');
  } catch(e) {
    setStatus('Error al guardar','err');
    toast('Error: ' + e.message,'err');
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
    label.textContent = 'Guardar en GitHub';
  }
}

// ══ Actualizar rawContent ═════════════════════════════════════
function updateRaw(p) {
  const marker = `{id:${p.id},`;
  const start  = rawContent.indexOf(marker);
  if (start === -1) { toast('No encontré id:' + p.id + ' en el archivo','err'); return false; }
  let depth = 0, i = start;
  while (i < rawContent.length) {
    if (rawContent[i]==='{') depth++;
    else if (rawContent[i]==='}') { depth--; if (depth===0) break; }
    i++;
  }
  rawContent = rawContent.slice(0, start) + buildBlock(p) + rawContent.slice(i+1);
  return true;
}

function esc(s)      { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function esc4html(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function buildBlock(p) {
  const badges = '[' + (p.badges||[]).map(b=>`{t:'${esc(b.t)}',c:'${esc(b.c)}'}`).join(',') + ']';
  return `{id:${p.id},nombre:'${esc(p.nombre)}',marca:'${esc(p.marca)}',tipo:'${esc(p.tipo)}',
   precio:${p.precio},velocidad:${p.velocidad||0},peso:${p.peso||0},rueda:'${esc(p.rueda||'')}',velocidades:'${esc(p.velocidades||'—')}',cargaMax:${p.cargaMax||0},
   estrellas:${p.estrellas},resenas:${p.resenas},
   badges:${badges},
   linkAmz:'${esc(p.linkAmz||'')}',linkML:'${esc(p.linkML||'')}',
   img:'${esc(p.img||'')}'}`;
}

// ══ Helpers ═══════════════════════════════════════════════════
function setStatus(msg, cls) {
  const el = document.getElementById('hdr-status');
  el.textContent = msg;
  el.className   = cls || '';
}
function toast(msg, cls) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'toast show' + (cls ? ' '+cls : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'toast', 4000);
}
document.getElementById('overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>

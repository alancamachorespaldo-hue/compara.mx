<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ac:#006847;--ac2:#004d34;--ac3:#e8f5f0;
  --amz:#f90;--ml:#f0c000;
  --bg:#f7f7f5;--card:#fff;--t:#0F172A;--t2:#64748b;--bd:#e2e2dc;
  font-family:'Satoshi',sans-serif;color:var(--t)
}
body{background:var(--bg);min-height:100vh}

/* ── Nav ─────────────────────────────────────────────── */
nav{background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;position:sticky;top:0;z-index:100}
.nav-logo{display:flex;align-items:center;text-decoration:none;flex-shrink:0}
.nav-links{display:flex;gap:1.5rem;align-items:center;flex-shrink:0}
.nav-link{font-size:13px;color:var(--t2);text-decoration:none;font-weight:500;transition:color .15s}
.nav-link:hover{color:var(--ac)}
.nav-link.active{color:var(--ac);font-weight:700}
.nav-link.dim{opacity:.4;pointer-events:none}
.nav-search{display:flex;align-items:center;flex:1;max-width:320px;background:#f1f5f9;border:1.5px solid var(--bd);border-radius:22px;padding:0 14px;gap:7px;transition:border-color .15s}
.nav-search:focus-within{border-color:var(--ac);background:#fff}
.nav-search-icon{color:var(--t2);font-size:.85rem;flex-shrink:0}
.nav-search-input{border:none;background:transparent;outline:none;font-size:.82rem;font-family:'Satoshi',sans-serif;color:var(--t);width:100%;padding:7px 0}
.nav-search-input::placeholder{color:var(--t2)}
@media(max-width:700px){.nav-search{max-width:140px}.nav-links{gap:.8rem}}

/* ── Hero ────────────────────────────────────────────── */
.hero{background:linear-gradient(135deg,var(--ac) 0%,var(--ac2) 100%);color:#fff;padding:14px 20px 12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero h1{font-size:1.05rem;font-weight:800;letter-spacing:-.02em}
.hero p{opacity:.8;font-size:.78rem}

/* ── Breadcrumb ──────────────────────────────────────── */
.breadcrumb{padding:.55rem 20px;font-size:12px;color:var(--t2);background:var(--s);border-bottom:1px solid var(--bd)}
.breadcrumb a{color:var(--ac);text-decoration:none}
.breadcrumb a:hover{text-decoration:underline}
/* ── Toolbar ─────────────────────────────────────────── */
.toolbar{background:#fff;border-bottom:1px solid var(--bd);padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:49px;z-index:90}
.filter-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:1}
.chip{padding:6px 14px;border-radius:20px;border:1px solid var(--bd);background:#fff;font-size:.78rem;font-weight:500;cursor:pointer;transition:all .15s;color:var(--t2);white-space:nowrap}
.chip:hover{border-color:var(--ac);color:var(--ac)}
.chip.active{background:var(--ac);border-color:var(--ac);color:#fff}
.sort-sel{padding:6px 12px;border:1px solid var(--bd);border-radius:8px;font-size:.78rem;background:#fff;color:var(--t);cursor:pointer}
.sort-sel:focus{outline:none;border-color:var(--ac)}
.result-cnt{font-size:.78rem;color:var(--t2);margin-left:auto}
.search-wrap{width:100%;margin-bottom:8px}
/* Filtros móvil */
.mobile-filter-toggle{display:none}
@media(max-width:600px){
  .toolbar{padding:10px 12px;top:64px}
  .mobile-filter-toggle{display:flex;align-items:center;gap:6px;width:100%;padding:9px 14px;border-radius:10px;border:1.5px solid var(--bd);background:#fff;font-size:.82rem;font-weight:600;color:var(--t);cursor:pointer;justify-content:space-between}
  .mobile-filter-toggle.open{border-color:var(--ac);color:var(--ac)}
  .chips-panel{display:none;width:100%;flex-direction:column;gap:8px}
  .chips-panel.open{display:flex}
  #chips,#sort-chips{display:flex;flex-wrap:wrap;gap:6px}
}
.search-input{width:100%;padding:9px 14px;border:1.5px solid var(--bd);border-radius:10px;font-size:.84rem;font-family:'Satoshi',sans-serif;color:var(--t);background:#fff;outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--ac)}

/* ── Grid ────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 20px;max-width:1400px;margin:0 auto}
.grid:has(.cat-section){display:block;padding:0}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:780px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr);padding:10px 8px}}

/* ── Card ────────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .15s,border-color .15s;position:relative}
.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.07);transform:translateY(-2px)}
.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.09);transform:translateY(-2px)}

.card-top{display:flex;gap:10px;padding:12px 12px 8px}
.card-img{width:72px;height:72px;object-fit:contain;border-radius:8px;background:#f1f5f9;flex-shrink:0}
.card-info{flex:1;min-width:0}
.card-badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:.66rem;font-weight:700}
.b-amz{background:var(--amz);color:#000}
.b-ml{background:var(--ml);color:#000}
.b-ifos{background:#6366f1;color:#fff}
.b-hmfree{background:#0ea5e9;color:#fff}
.b-best{background:#22c55e;color:#000}
.b-salmon{background:#fb923c;color:#fff}
.b-anchoa{background:#3b82f6;color:#fff}
.b-linaza{background:#84cc16;color:#000}
.card-name{font-size:.88rem;font-weight:700;line-height:1.35;color:var(--t);margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-brand{font-size:.75rem;color:var(--t2)}

/* Stars */
.stars{display:flex;align-items:center;gap:4px;margin-top:4px}
.stars-val{color:#f59e0b;font-size:.78rem;font-weight:600}
.stars-cnt{font-size:.72rem;color:var(--t2)}

/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.metric{padding:10px 8px;text-align:center;border-right:1px solid var(--bd)}
.metric:last-child{border-right:none}
.metric-val{font-size:.95rem;font-weight:800;color:var(--ac);line-height:1}
.metric-lbl{font-size:.62rem;color:var(--t2);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}

/* Details row */
.details{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap}
.detail-tag{font-size:.72rem;padding:3px 9px;border-radius:20px;background:var(--ac3);color:var(--ac);font-weight:500}

/* Price & CTA */
.card-bottom{padding:8px 12px;margin-top:auto;display:flex;flex-direction:column;gap:8px}
.price-block{width:100%}
.price-main{font-size:1.35rem;font-weight:800;color:var(--t);letter-spacing:-.02em}

.btns{display:flex;flex-direction:column;gap:6px;width:100%}
.btns.dual{flex-direction:row;gap:8px;align-items:flex-end}
.dual-col{display:flex;flex-direction:column;gap:5px;flex:1;align-items:center}
.dual-price{font-size:1.4rem;font-weight:800;color:var(--t);letter-spacing:-.03em;text-align:center;line-height:1}
.btn-buy{display:flex;align-items:center;justify-content:center;width:100%;padding:9px;border-radius:8px;font-weight:700;font-size:.73rem;text-decoration:none;border:none;cursor:pointer;transition:opacity .15s}
.btn-buy:hover{opacity:.88}
.btn-amz{background:var(--amz);color:#000}
.btn-ml{background:var(--ml);color:#000}
.btn-logo{height:28px;width:auto;max-width:120px;object-fit:contain;flex-shrink:0}

/* ── Vista Todos (secciones por categoría) ─────────────── */
.cat-section{padding:24px 20px 6px;max-width:1400px;margin:0 auto}
.cat-section-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.cat-section-meta{display:flex;flex-direction:column;gap:3px}
.cat-section-title{font-size:1.25rem;font-weight:800;color:var(--t);letter-spacing:-.02em}
.cat-section-desc{font-size:.82rem;color:var(--t2)}
.cat-ver-mas{background:none;border:1.5px solid var(--ac);border-radius:8px;color:var(--ac);padding:7px 16px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:'Satoshi',sans-serif;transition:background .15s,color .15s;white-space:nowrap;flex-shrink:0;align-self:flex-start}
.cat-ver-mas:hover{background:var(--ac);color:#fff}
.cat-content-row{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:stretch}
@media(max-width:860px){.cat-content-row{grid-template-columns:1fr}}
.cat-benefits{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column}
.cat-benefits-title{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--t2);margin-bottom:10px}
.cat-benefits-list{display:flex;flex-direction:column;gap:8px;flex:1}
.cat-benefit-item{display:flex;align-items:flex-start;gap:8px;font-size:.78rem;color:var(--t);line-height:1.4}
.cat-benefit-icon{color:var(--ac);flex-shrink:0;font-size:.9rem;font-weight:700}
.cat-preview-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:780px){.cat-preview-row{grid-template-columns:repeat(2,1fr)}}
.cat-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;transition:box-shadow .2s,transform .15s;display:flex;flex-direction:column;gap:0;text-align:center;position:relative;text-decoration:none}
.cat-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.09);transform:translateY(-2px)}
.cat-card-platform{position:absolute;top:8px;right:8px;display:flex;gap:3px}
.cat-card-plat-badge{height:16px;width:auto;object-fit:contain;border-radius:3px}
.cat-card-img-wrap{background:#f7f7f5;border-radius:8px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;height:110px;overflow:hidden}
.cat-card-img{max-width:90%;max-height:100px;object-fit:contain}
.cat-card-name{font-size:.75rem;font-weight:700;color:var(--t);line-height:1.35;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:left}
.cat-card-stars{font-size:.7rem;color:#e6900a;text-align:left;margin-bottom:6px}
.cat-card-stars span{color:var(--t2);font-size:.68rem}
.cat-card-metric{font-size:.68rem;color:var(--t2);background:#f1f5f9;border-radius:5px;padding:2px 7px;display:inline-block;margin-bottom:7px;align-self:flex-start}
.cat-card-price-row{display:flex;align-items:baseline;gap:6px;text-align:left;margin-top:auto}
.cat-card-price{font-size:1rem;font-weight:800;color:var(--ac)}
.cat-card-sub{font-size:.68rem;color:var(--t2)}
.cat-card-ver{display:block;width:100%;margin-top:8px;background:var(--ac);color:#fff;border:none;border-radius:7px;padding:7px 0;font-size:.74rem;font-weight:700;cursor:pointer;font-family:'Satoshi',sans-serif;text-align:center;text-decoration:none}
.cat-card-ver:hover{background:var(--ac2);color:#fff}
.cat-sep{border:none;border-top:1px solid var(--bd);margin:20px 0 0}

/* Card seleccionable para comparar */
.card{cursor:pointer}
.card.in-compare{border-color:var(--ac);box-shadow:0 0 0 3px rgba(0,104,71,.25)}
.card-check{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--ac);display:none;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(0,104,71,.4)}
.card.in-compare .card-check{display:flex}

/* Barra flotante de comparación */
.cmp-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--ac);padding:12px 20px;display:none;align-items:center;gap:12px;z-index:200;box-shadow:0 -4px 20px rgba(0,0,0,.1)}
.cmp-bar.show{display:flex}
.cmp-slots{display:flex;gap:8px;flex:1;flex-wrap:wrap}
.cmp-slot{display:flex;align-items:center;gap:6px;background:var(--ac3);border:1px solid var(--ac);border-radius:8px;padding:6px 10px;font-size:.78rem;font-weight:500;color:var(--ac)}
.cmp-slot button{background:none;border:none;cursor:pointer;color:var(--ac);font-size:.9rem;line-height:1;padding:0 2px}
.cmp-bar-hint{font-size:.78rem;color:var(--t2)}
.btn-compare{padding:9px 20px;background:var(--ac);border:none;border-radius:8px;color:#fff;font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap}
.btn-compare:hover{background:var(--ac2)}
.btn-compare:disabled{opacity:.4;cursor:default}

/* Modal comparación */
.cmp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.cmp-overlay.open{display:flex}
.cmp-modal{background:#fff;border-radius:16px;width:100%;max-width:960px;overflow:hidden;margin:auto}
.cmp-modal-header{background:var(--ac);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.cmp-modal-header h2{font-size:1rem;font-weight:700}
.cmp-modal-close{background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;opacity:.8}
.cmp-modal-close:hover{opacity:1}
.cmp-table-wrap{overflow-x:auto;padding:0}
.cmp-table{width:100%;border-collapse:collapse}
.cmp-table th{background:var(--ac3);color:var(--ac);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;text-align:left;border-bottom:2px solid var(--bd);position:sticky;left:0;z-index:1}
.cmp-table .col-prod{text-align:center;min-width:200px}
.cmp-table td{padding:11px 14px;border-bottom:1px solid var(--bd);font-size:.83rem;text-align:center;vertical-align:middle}
.cmp-table tr:last-child td{border-bottom:none}
.cmp-table .row-label{text-align:left;font-weight:600;font-size:.78rem;color:var(--t2);background:#fafbfc;white-space:nowrap}
.cmp-best{color:var(--ac);font-weight:800}
.cmp-win{background:#d4f0e3;color:#004d34;font-weight:800}
.cmp-img{width:60px;height:60px;object-fit:contain;border-radius:8px;background:#f1f5f9;margin:0 auto 6px;display:block}
.cmp-prod-name{font-size:.8rem;font-weight:700;line-height:1.3;margin-bottom:4px}
.cmp-prod-marca{font-size:.72rem;color:var(--t2)}
.cmp-btn-buy{display:inline-block;padding:7px 14px;border-radius:7px;font-weight:700;font-size:.75rem;text-decoration:none;margin-top:6px}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:var(--t2);grid-column:1/-1}

/* Footer */
footer{text-align:center;padding:28px 20px;font-size:.78rem;color:var(--t2);border-top:1px solid var(--bd);margin-top:20px}
footer a{color:var(--ac);text-decoration:none}

@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,1fr);padding:10px 8px}
  .metrics{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

function toggleFiltrosMobile() {
  const panel = document.getElementById('chips-panel');
  const btn = document.getElementById('filter-toggle');
  const arrow = document.getElementById('filter-arrow');
  const open = panel.classList.toggle('open');
  btn.classList.toggle('open', open);
  arrow.textContent = open ? '▴' : '▾';
}

let sortActivo = 'precio-asc';

function setFiltro(tipo, el) {
  filtroTipo = tipo;
  document.querySelectorAll('#chips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  // Actualizar miga de pan
  const catLabel = {todos:'Suplementos', vitaminas:'Suplementos › Omega 3 / Vitaminas', 'complejo-b':'Suplementos › Complejo B'};
  document.getElementById('breadcrumb-cat').textContent = catLabel[tipo] || 'Suplementos';
  // Al cambiar categoría, limpiar selección
  seleccionados = [];
  actualizarBarraCmp();
  render();
}

function setSort(valor, el) {
  sortActivo = valor;
  document.querySelectorAll('#sort-chips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');

}

function buscarDesdeNav(q, scrollResultados) {
  // Sincronizar con el input de búsqueda del panel
  const panelInput = document.getElementById('search-input');
  if (panelInput) panelInput.value = q;
  // Si hay texto, cambiar a vista "todos" para que el filtro aplique
  if (q.trim()) {
    filtroTipo = 'todos';
    document.querySelectorAll('#chips .chip').forEach(c => c.classList.remove('active'));
    const allChip = document.querySelector('#chips .chip[data-tipo="todos"]');
    if (allChip) allChip.classList.add('active');
    document.getElementById('breadcrumb-cat').textContent = 'Suplementos';
  }
  render();
  if (scrollResultados && q.trim()) {
    setTimeout(() => {
      const grid = document.getElementById('grid');
      if (grid) grid.scrollIntoView({behavior:'smooth', block:'start'});
    }, 100);
  }
}

function sortLista(lista, sort) {
  return lista.slice().sort((a,b) => {
    switch(sort) {
      case 'precio-asc':    return a.precio - b.precio;
      case 'precio-desc':   return b.precio - a.precio;
      case 'costo-asc':     return a.costoPorPorcion - b.costoPorPorcion;
      case 'epa-desc':      return b.epa - a.epa;
      case 'resenas-desc':  return b.resenas - a.resenas;
      case 'estrellas-desc':return b.estrellas - a.estrellas;
      default: return 0;
    }
  });
}

function render() {
  const sort = sortActivo;
  const q = (document.getElementById('search-input').value || '').toLowerCase().trim();
  const grid = document.getElementById('grid');

  if (filtroTipo === 'todos' && !q) {
    // Vista de categorías: fila por categoría con 4 previews
    document.getElementById('result-cnt').textContent = `${productos.length} productos`;
    grid.innerHTML = CATEGORIAS.map(cat => {
      const prods = sortLista(productos.filter(p => p.tipo === cat.tipo), 'precio-asc');
      const preview = prods.slice(0, 4);
      const beneficiosHTML = cat.beneficios.map(b =>
        `<div class="cat-benefit-item"><span class="cat-benefit-icon">✓</span><span>${b}</span></div>`
      ).join('');
      const cardsHTML = preview.map(p => {
        const hasAmz = !!p.linkAmz;
        const hasML  = !!p.linkML;
        const platHTML = [
          hasAmz ? `<img class="cat-card-plat-badge" src="logoamazon.png" alt="Amazon" onerror="this.style.display='none'">` : '',
          hasML  ? `<img class="cat-card-plat-badge" src="logomercado.png" alt="ML" onerror="this.style.display='none'">` : ''
        ].join('');
        const starsHTML = p.estrellas > 0
          ? `<div class="cat-card-stars">★ ${p.estrellas.toFixed(1)} <span>(${p.resenas.toLocaleString('es-MX')})</span></div>`
          : '';
        const metricLbl = p.tipo==='complejo-b'
          ? (p.b12 ? `B12: ${p.b12}` : `${p.porciones} porc.`)
          : (p.epa > 0 ? `EPA ${p.epa}mg` : `${p.porciones} porc.`);
        return `
        <div class="cat-card" onclick="irACategoria('${cat.tipo}', ${p.id})">
          <div class="cat-card-platform">${platHTML}</div>
          <div class="cat-card-img-wrap">
            <img class="cat-card-img" src="${p.img}" alt="${p.nombre}" loading="lazy" onerror="this.style.display='none'">
          </div>
          <div class="cat-card-name">${p.nombre.substring(0,45)}</div>
          ${starsHTML}
          <div class="cat-card-metric">${metricLbl}</div>
          <div class="cat-card-price-row">
            <span class="cat-card-price">$${p.precio.toLocaleString('es-MX')}</span>
            ${p.costoPorPorcion?`<span class="cat-card-sub">$${p.costoPorPorcion.toFixed(2)}/porc.</span>`:''}
          </div>
          <span class="cat-card-ver">Ver producto →</span>
        </div>`;
      }).join('');
      return `
      <div class="cat-section">
        <div class="cat-section-header">
          <div class="cat-section-meta">
            <div class="cat-section-title">${cat.label}</div>
            <div class="cat-section-desc">${cat.desc}</div>
          </div>
          <button class="cat-ver-mas" onclick="irACategoria('${cat.tipo}')">Ver todos los ${cat.label} →</button>
        </div>
        <div class="cat-content-row">
          <div class="cat-benefits">
            <div class="cat-benefits-title">Beneficios principales</div>
            <div class="cat-benefits-list">${beneficiosHTML}</div>
          </div>
          <div class="cat-preview-row">${cardsHTML}</div>
        </div>
        <hr class="cat-sep">
      </div>`;
    }).join('');
    return;
  }

  let lista = filtroTipo === 'todos' ? [...productos] : productos.filter(p => p.tipo === filtroTipo);
  if (q) lista = lista.filter(p =>
    p.nombre.toLowerCase().includes(q) ||
    p.marca.toLowerCase().includes(q) ||
    (p.fuenteOmega||'').toLowerCase().includes(q) ||
    (p.forma||'').toLowerCase().includes(q) ||
    p.tipo.toLowerCase().includes(q)
  );
  lista = sortLista(lista, sort);

  document.getElementById('result-cnt').textContent = `${lista.length} producto${lista.length!==1?'s':''}`;
  if (!lista.length) {
    grid.innerHTML = '<div class="empty">Sin resultados para este filtro.</div>';
    return;
  }
  grid.innerHTML = lista.map(p => cardHTML(p)).join('');
}

function irACategoria(tipo, idDestino) {
  filtroTipo = tipo;
  const chip = document.querySelector(`#chips .chip[data-tipo="${tipo}"]`);
  if (chip) {
    document.querySelectorAll('#chips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
  }
  const catLabel = {vitaminas:'Suplementos › Omega 3 / Vitaminas', 'complejo-b':'Suplementos › Complejo B'};
  document.getElementById('breadcrumb-cat').textContent = catLabel[tipo] || 'Suplementos';
  seleccionados = [];
  actualizarBarraCmp();
  render();
  if (idDestino) {
    setTimeout(() => {
      const card = document.getElementById('card-' + idDestino);
      if (card) card.scrollIntoView({ behavior:'smooth', block:'center' });
    }, 100);
  }
}

function cardHTML(p) {
  // Badges plataforma
  const bdgs = (p.badges||[]).map(b => `<span class="badge ${b.c}">${b.t}</span>`).join('');

  // Badges especiales
  const extras = [];
  if (p.certificadoIFOS)    extras.push(`<span class="badge b-ifos">IFOS ✓</span>`);
  if (p.libreMetalesPesados) extras.push(`<span class="badge b-hmfree">Sin metales pesados</span>`);

  // Fuente badge
  const fuenteClase = {anchoa:'b-anchoa',salmon:'b-salmon',linaza:'b-linaza'}[p.fuenteOmega] || '';
  const fuenteLbl   = {anchoa:'Anchoa',salmon:'Salmón',linaza:'Linaza',ninguna:''}[p.fuenteOmega] || '';

  // Métricas: según tipo
  let metricasHTML = '';
  if (p.tipo === 'complejo-b') {
    const b12lbl = p.b12 || '—';
    metricasHTML = `
      <div class="metric"><div class="metric-val">${b12lbl}</div><div class="metric-lbl">B12</div></div>
      <div class="metric"><div class="metric-val">${p.porciones}</div><div class="metric-lbl">Porciones</div></div>
      <div class="metric"><div class="metric-val">$${p.costoPorPorcion.toFixed(2)}</div><div class="metric-lbl">$/porción</div></div>`;
  } else if (p.omegaTotal > 0) {
    metricasHTML = `
      <div class="metric"><div class="metric-val">${p.epa>0?p.epa+'mg':'—'}</div><div class="metric-lbl">EPA</div></div>
      <div class="metric"><div class="metric-val">${p.dha>0?p.dha+'mg':'—'}</div><div class="metric-lbl">DHA</div></div>
      <div class="metric"><div class="metric-val">$${p.costoPorPorcion.toFixed(2)}</div><div class="metric-lbl">$/porción</div></div>`;
  } else {
    metricasHTML = `
      <div class="metric"><div class="metric-val">${p.porciones}</div><div class="metric-lbl">Porciones</div></div>
      <div class="metric"><div class="metric-val">${p.duracion||'—'}</div><div class="metric-lbl">Días</div></div>
      <div class="metric"><div class="metric-val">$${p.costoPorPorcion.toFixed(2)}</div><div class="metric-lbl">$/porción</div></div>`;
  }

  // Estrellas
  const stars = p.estrellas > 0
    ? `<div class="stars"><span class="stars-val">★ ${p.estrellas.toFixed(1)}</span><span class="stars-cnt">(${p.resenas.toLocaleString('es-MX')} reseñas)</span></div>`
    : '';

  // Botones con logos — si hay ambas plataformas, mostrar precio encima de cada botón
  const tieneAmbos = p.linkAmz && p.linkML;
  const btnAmz = p.linkAmz ? `<a class="btn-buy btn-amz" href="${p.linkAmz}" target="_blank" rel="nofollow noopener">Ver en <img class="btn-logo" src="logoamazon.png" alt="Amazon" onerror="this.style.display='none'"></a>` : '';
  const btnML  = p.linkML  ? `<a class="btn-buy btn-ml"  href="${p.linkML}"  target="_blank" rel="nofollow noopener">Ver en <img class="btn-logo" src="logomercado.png" alt="ML" onerror="this.style.display='none'"></a>` : '';

  // Detalles
  const detalles = [];
  if (p.tipo === 'complejo-b') {
    if (p.formaB12) detalles.push(`💊 ${p.formaB12}`);
    (p.certificaciones||[]).slice(0,2).forEach(c => detalles.push(c));
  } else {
    if (fuenteLbl && fuenteLbl !== '') detalles.push(`🐟 ${fuenteLbl}`);
    if (p.porciones > 0) detalles.push(`${p.porciones} porciones`);
  }

  return `
  <div class="card" id="card-${p.id}" onclick="toggleComparar(${p.id})" title="Clic para comparar">
    <div class="card-check">✓</div>
    <div class="card-top">
      <img class="card-img" src="${p.img}" alt="${p.nombre}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'88\' height=\'88\'><rect fill=\'%23f1f5f9\' width=\'88\' height=\'88\'/></svg>'">
      <div class="card-info">
        <div class="card-badges">${bdgs}${extras.join('')}</div>
        <div class="card-name">${p.nombre}</div>
        <div class="card-brand">${p.marca}</div>
        ${stars}
      </div>
    </div>
    <div class="metrics">${metricasHTML}</div>
    ${detalles.length ? `<div class="details">${detalles.map(d=>`<span class="detail-tag">${d}</span>`).join('')}</div>` : ''}
    <div class="card-bottom">
      ${tieneAmbos ? `
      <div class="btns dual" onclick="event.stopPropagation()">
        <div class="dual-col">
          <div class="dual-price">$${(p.precioML||p.precio).toLocaleString('es-MX')}</div>
          ${btnML}
        </div>
        <div class="dual-col">
          <div class="dual-price">$${(p.precioAmz||p.precio).toLocaleString('es-MX')}</div>
          ${btnAmz}
        </div>
      </div>` : `
      <div class="price-block">
        <div class="price-main">$${p.precio.toLocaleString('es-MX')}</div>
      </div>
      <div class="btns" onclick="event.stopPropagation()">${btnAmz}${btnML}</div>`}
    </div>
  </div>`;
}

// ── Comparación ───────────────────────────────────────────────
let seleccionados = []; // ids

function toggleComparar(id) {
  const idx = seleccionados.indexOf(id);
  if (idx !== -1) {
    seleccionados.splice(idx, 1);
  } else {
    if (seleccionados.length >= 3) { alert('Máximo 3 productos para comparar.'); return; }
    // Solo permitir comparar productos del mismo tipo
    if (seleccionados.length > 0) {
      const tipoActual = productos.find(x => x.id === seleccionados[0]).tipo;
      const tipoNuevo  = productos.find(x => x.id === id).tipo;
      if (tipoActual !== tipoNuevo) {
        alert('Solo puedes comparar productos del mismo tipo (Omega 3 con Omega 3, Complejo B con Complejo B).');
        return;
      }
    }
    seleccionados.push(id);
  }
  actualizarBarraCmp();
}

function actualizarBarraCmp() {
  const bar = document.getElementById('cmp-bar');
  const slots = document.getElementById('cmp-slots');
  const btnCmp = document.getElementById('btn-comparar');

  // Actualizar estado visual de cards
  document.querySelectorAll('.card').forEach(c => c.classList.remove('in-compare'));
  seleccionados.forEach(id => {
    const card = document.getElementById('card-' + id);
    if (card) card.classList.add('in-compare');
  });

  if (seleccionados.length === 0) { bar.classList.remove('show'); return; }
  bar.classList.add('show');

  slots.innerHTML = seleccionados.map(id => {
    const p = productos.find(x => x.id === id);
    return `<div class="cmp-slot">${p.marca} – ${p.nombre.substring(0,28)}…<button onclick="toggleComparar(${id})">✕</button></div>`;
  }).join('');

  btnCmp.disabled = seleccionados.length < 2;
  btnCmp.textContent = seleccionados.length < 2 ? 'Selecciona 2 o más' : `Comparar ${seleccionados.length} productos`;
}

function abrirComparacion() {
  const prods = seleccionados.map(id => productos.find(p => p.id === id));
  const overlay = document.getElementById('cmp-overlay');

  // Genera una fila con resaltado automático.
  // mejor: 'min' | 'max' | null (sin resaltado)
  // vals: array de {num, label} — num para comparar, label para mostrar
  function fila(etiqueta, items, mejor) {
    const nums = items.map(x => x.num);
    let ganador = null;
    if (mejor === 'min') {
      const validos = nums.filter(n => n > 0);
      if (validos.length) ganador = Math.min(...validos);
    } else if (mejor === 'max') {
      const validos = nums.filter(n => n > 0);
      if (validos.length) ganador = Math.max(...validos);
    }
    const celdas = items.map(({num, label}) => {
      const esGanador = ganador !== null && num === ganador && num > 0;
      return esGanador
        ? `<td class="cmp-win">${label}</td>`
        : `<td>${label}</td>`;
    }).join('');
    return `<tr><td class="row-label">${etiqueta}</td>${celdas}</tr>`;
  }

  const colPct = Math.floor(90 / prods.length);

  const cabeceras = prods.map(p => {
    const tieneAmbos = p.linkML && p.linkAmz;
    const btnsHeader = tieneAmbos
      ? `<div style="display:flex;flex-direction:row;gap:6px;justify-content:center;align-items:center">
           <a class="cmp-btn-buy btn-ml"  href="${p.linkML}"  target="_blank" rel="nofollow noopener">Ver en <img class="btn-logo" src="logomercado.png" alt="" onerror="this.style.display='none'"></a>
           <a class="cmp-btn-buy btn-amz" href="${p.linkAmz}" target="_blank" rel="nofollow noopener">Ver en <img class="btn-logo" src="logoamazon.png" alt="" onerror="this.style.display='none'"></a>
         </div>`
      : `${p.linkML  ? `<a class="cmp-btn-buy btn-ml"  href="${p.linkML}"  target="_blank" rel="nofollow noopener">Ver en <img class="btn-logo" src="logomercado.png" alt="" onerror="this.style.display='none'"></a>` : ''}
         ${p.linkAmz ? `<a class="cmp-btn-buy btn-amz" href="${p.linkAmz}" target="_blank" rel="nofollow noopener">Ver en <img class="btn-logo" src="logoamazon.png" alt="" onerror="this.style.display='none'"></a>` : ''}`;
    return `
    <th class="col-prod" style="width:${colPct}%">
      <img class="cmp-img" src="${p.img}" alt="${p.nombre}" onerror="this.src='data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'60\' height=\'60\'><rect fill=\'%23f1f5f9\' width=\'60\' height=\'60\'/></svg>'">
      <div class="cmp-prod-name">${p.nombre}</div>
      <div class="cmp-prod-marca">${p.marca}</div>
      ${btnsHeader}
    </th>`;
  }).join('');

  const fuenteLabel = f => ({anchoa:'🐟 Anchoa',salmon:'🐟 Salmón',linaza:'🌱 Linaza','krill':'🦐 Krill','krill+pescado':'🦐 Krill+Pescado','pollock':'🐟 Pollock','multi-pez':'🐟 Multi-pez','multi-pez+vegetal':'🐟+🌱 Mix',ninguna:'—'}[f] || f || '—');

  // Detectar tipo de comparación
  const tiposEnComparacion = [...new Set(prods.map(p => p.tipo))];
  const todosOmega   = tiposEnComparacion.length === 1 && tiposEnComparacion[0] === 'vitaminas' && prods.some(p => p.omegaTotal > 0);
  const todosComplejoB = tiposEnComparacion.length === 1 && tiposEnComparacion[0] === 'complejo-b';

  // Filas omega (solo si todos son vitaminas con omega)
  const filasOmega = todosOmega ? `
      ${fila('EPA',             prods.map(p => ({num:p.epa,              label:p.epa>0?p.epa+'mg':'—'})),               'max')}
      ${fila('DHA',             prods.map(p => ({num:p.dha,              label:p.dha>0?p.dha+'mg':'—'})),               'max')}
      ${fila('Omega/porción',   prods.map(p => ({num:p.omegaPorPorcion,  label:p.omegaPorPorcion>0?p.omegaPorPorcion+'mg':'—'})), 'max')}
      ${fila('Fuente',          prods.map(p => ({num:0,                  label:fuenteLabel(p.fuenteOmega)})),           null)}
      ${fila('Sin metales pesados', prods.map(p => ({num:p.libreMetalesPesados?1:0, label:p.libreMetalesPesados?'✅':'—'})), 'max')}` : '';

  // Filas complejo B (solo si todos son complejo-b)
  const filasComplejoB = todosComplejoB ? `
      ${fila('Vitamina B12',   prods.map(p => ({num:parseFloat((p.b12||'0').replace(/[^\d.]/g,'')||'0'), label:p.b12||'—'})), 'max')}
      ${fila('Forma B12',      prods.map(p => ({num:0, label:p.formaB12||'—'})), null)}
      ${fila('B1 (Tiamina)',   prods.map(p => ({num:parseFloat((p.b1||'0').replace(/[^\d.]/g,'')||'0'), label:p.b1||'—'})), 'max')}
      ${fila('B6 (Piridoxina)',prods.map(p => ({num:parseFloat((p.b6||'0').replace(/[^\d.]/g,'')||'0'), label:p.b6||'—'})), 'max')}
      ${fila('B9 (Ácido Fólico)',prods.map(p => ({num:parseFloat((p.b9||'0').replace(/[^\d.]/g,'')||'0'), label:p.b9||'—'})), 'max')}
      ${fila('Certificaciones',prods.map(p => {
        const noSonCerts = new Set(['100% Vegano','Vegano','Sin Rellenos','100% Natural','Hecho en México','Bottle Free','VCaps','Cápsula Vegetal','Vegetariano','Integral Sustentable','Ingredientes de Origen Natural','Calidad Premium','Non GMO']);
        const certs = (p.certificaciones||[]).filter(c => !noSonCerts.has(c));
        return {num:0, label: certs.length ? certs.join(', ') : '—'};
      }), null)}` : '';

  // Fila de botones de compra
  const filaBtns = `<tr>
    <td class="row-label">Comprar</td>
    ${prods.map(p => {
      const tieneAmbos = p.linkML && p.linkAmz;
      if (tieneAmbos) {
        return `<td>
          <div style="display:flex;flex-direction:row;gap:6px;justify-content:center;align-items:center">
            <div style="display:flex;flex-direction:column;gap:4px;align-items:center">
              <span style="font-size:.75rem;font-weight:700;color:var(--t)">$${(p.precioML||p.precio).toLocaleString('es-MX')}</span>
              <a class="btn-buy btn-ml" href="${p.linkML}" target="_blank" rel="nofollow noopener" style="justify-content:center">Ver en <img class="btn-logo" src="logomercado.png" alt="" onerror="this.style.display='none'"></a>
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;align-items:center">
              <span style="font-size:.75rem;font-weight:700;color:var(--t)">$${(p.precioAmz||p.precio).toLocaleString('es-MX')}</span>
              <a class="btn-buy btn-amz" href="${p.linkAmz}" target="_blank" rel="nofollow noopener" style="justify-content:center">Ver en <img class="btn-logo" src="logoamazon.png" alt="" onerror="this.style.display='none'"></a>
            </div>
          </div>
        </td>`;
      }
      return `<td>
        <div style="display:flex;flex-direction:column;gap:5px;align-items:center">
          ${p.linkAmz ? `<a class="btn-buy btn-amz" href="${p.linkAmz}" target="_blank" rel="nofollow noopener" style="justify-content:center">Ver en <img class="btn-logo" src="logoamazon.png" alt="" onerror="this.style.display='none'"></a>` : ''}
          ${p.linkML  ? `<a class="btn-buy btn-ml"  href="${p.linkML}"  target="_blank" rel="nofollow noopener" style="justify-content:center">Ver en <img class="btn-logo" src="logomercado.png" alt="" onerror="this.style.display='none'"></a>` : ''}
        </div>
      </td>`;
    }).join('')}
  </tr>`;

  const tabla = `
  <table class="cmp-table">
    <thead><tr><th style="width:10%">Característica</th>${cabeceras}</tr></thead>
    <tbody>
      ${fila('Categoría',       prods.map(p => ({num:0, label:({vitaminas:'Omega 3 / Vitaminas','complejo-b':'Complejo B'})[p.tipo]||p.tipo})), null)}
      <tr><td class="row-label">Precio total</td>${prods.map(p => {
        if (p.linkML && p.linkAmz && p.precioML && p.precioAmz) {
          return `<td><div style="display:flex;flex-direction:row;gap:10px;justify-content:center;font-size:.85rem">
            <span><img src="logomercado.png" style="height:14px;vertical-align:middle;margin-right:3px" onerror="this.style.display='none'">$${p.precioML.toLocaleString('es-MX')}</span>
            <span><img src="logoamazon.png" style="height:14px;vertical-align:middle;margin-right:3px" onerror="this.style.display='none'">$${p.precioAmz.toLocaleString('es-MX')}</span>
          </div></td>`;
        }
        const minP = Math.min(...[p.precioML,p.precioAmz,p.precio].filter(Boolean));
        const allP = prods.map(q => {
          if(q.linkML&&q.linkAmz&&q.precioML&&q.precioAmz) return Math.min(q.precioML,q.precioAmz);
          return Math.min(...[q.precioML,q.precioAmz,q.precio].filter(Boolean));
        });
        const minAll = Math.min(...allP);
        const win = minP === minAll;
        return win ? `<td class="cmp-win">$${p.precio.toLocaleString('es-MX')}</td>` : `<td>$${p.precio.toLocaleString('es-MX')}</td>`;
      }).join('')}</tr>
      <tr><td class="row-label">$/porción</td>${prods.map(p => {
        if (p.linkML && p.linkAmz && p.precioML && p.precioAmz) {
          const cppML = p.precioML / p.porciones;
          const cppAmz = p.precioAmz / p.porciones;
          return `<td><div style="display:flex;flex-direction:row;gap:10px;justify-content:center;font-size:.85rem">
            <span><img src="logomercado.png" style="height:14px;vertical-align:middle;margin-right:3px" onerror="this.style.display='none'">$${cppML.toFixed(2)}</span>
            <span><img src="logoamazon.png" style="height:14px;vertical-align:middle;margin-right:3px" onerror="this.style.display='none'">$${cppAmz.toFixed(2)}</span>
          </div></td>`;
        }
        const allCpp = prods.map(q => {
          if(q.linkML&&q.linkAmz&&q.precioML&&q.precioAmz) return Math.min(q.precioML,q.precioAmz)/q.porciones;
          return q.costoPorPorcion;
        });
        const minAll = Math.min(...allCpp);
        const win = Math.abs(p.costoPorPorcion - minAll) < 0.001;
        return win ? `<td class="cmp-win">$${p.costoPorPorcion.toFixed(2)}</td>` : `<td>$${p.costoPorPorcion.toFixed(2)}</td>`;
      }).join('')}</tr>
      ${fila('Porciones',       prods.map(p => ({num:p.porciones,        label:String(p.porciones)})),                  'max')}
      ${fila('Por porción',     prods.map(p => ({num:0,                  label:p.porPorcion||'—'})),                    null)}
      ${filasOmega}
      ${filasComplejoB}
      ${fila('Calificación',    prods.map(p => ({num:p.estrellas,        label:p.estrellas>0?'★ '+p.estrellas.toFixed(1):'Sin reseñas'})), 'max')}
      ${fila('Reseñas',         prods.map(p => ({num:p.resenas,          label:p.resenas>0?p.resenas.toLocaleString('es-MX'):'—'})), 'max')}
      ${filaBtns}
    </tbody>
  </table>`;

  overlay.innerHTML = `
  <div class="cmp-modal">
    <div class="cmp-modal-header">
      <h2>Comparación de ${prods.length} productos</h2>
      <button class="cmp-modal-close" onclick="cerrarComparacion()">✕</button>
    </div>
    <div class="cmp-table-wrap">${tabla}</div>
  </div>`;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function cerrarComparacion() {
  document.getElementById('cmp-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// Iniciar
render();
</script>

<!-- Barra flotante de comparación -->
<div class="cmp-bar" id="cmp-bar">
  <div class="cmp-slots" id="cmp-slots"></div>
  <span class="cmp-bar-hint" id="cmp-hint"></span>
  <button class="btn-compare" id="btn-comparar" onclick="abrirComparacion()" disabled>Comparar</button>
</div>

<!-- Overlay modal comparación -->
<div class="cmp-overlay" id="cmp-overlay" onclick="if(event.target===this)cerrarComparacion()"></div>

</body>
</html>

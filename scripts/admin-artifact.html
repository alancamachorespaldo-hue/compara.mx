const SORTERS = {
  nombre:r => norm(r.p.nombre), mlId:r => r.p.mlId || null, precioML:r => r.p.precioML ?? null, precioAmz:r => r.p.precioAmz ?? null,

function sortValue(r, key) {
  if (key.startsWith('spec:')) { const t = specText(r.p, key.slice(5)); if (!t) return null; const n = parseFloat(t.replace(',', '.')); return isNaN(n) ? norm(t) : n; }

function visible() {
  const terms = norm(S.q).split(/\s+/).filter(Boolean);
  const qf = QF[S.queue] || QF.todos;
  const colf = Object.entries(S.colf);
  const out = [];
  for (const r of ROWS) {
    if (S.cat !== 'todas' && r.cat !== S.cat) continue;
    const p = r.p;
    if (!qf(p)) continue;
    if (S.plat === 'ml' && !p.linkML) continue;
    if (S.plat === 'amz' && !p.linkAmz) continue;
    if (S.plat === 'ambas' && !(p.linkML && p.linkAmz)) continue;
    if (terms.length) { const h = hay(r); if (!terms.every(t => h.includes(t))) continue; }
    if (colf.length && !colf.every(([sk, set]) => set.has(specText(p, sk)))) continue;
    out.push(r);
  }
  if (S.sort) {
    const d = S.dir;
    const keyed = out.map(r => [sortValue(r, S.sort), r]);
    keyed.sort((a, b) => {
      if (a[0] == null && b[0] == null) return 0;
      if (a[0] == null) return 1;
      if (b[0] == null) return -1;
      return (typeof a[0] === 'number' && typeof b[0] === 'number' ? a[0] - b[0] : String(a[0]).localeCompare(String(b[0]), 'es')) * d;

}

// ── Edición en línea ────────────────────────────────────────────────────────
function startInline(key, field) {
  const tr = rowEl(key), r = BYKEY.get(key);
  if (!tr || !r) return;
  const td = tr.querySelector(`[data-cell="${field}"]`);
  if (!td) return;
  const isId = field === 'mlId';
  const input = document.createElement('input');
  input.className = 'inline-input' + (isId ? ' wide' : '');
  input.type = isId ? 'text' : 'number';
  if (!isId) { input.min = '0'; input.step = '1'; input.inputMode = 'decimal'; }
  input.value = isId ? (r.p.mlId || '') : (r.p[field] ?? '');
  input.placeholder = isId ? 'Pega el link de catálogo /p/MLM…' : '0';
  input.setAttribute('aria-label', isId ? 'ID de catálogo de Mercado Libre' : (field === 'precioML' ? 'Precio ML' : 'Precio Amazon'));
  td.replaceChildren(input);
  input.focus(); input.select();
  let done = false;
  const finish = (commit, move, fromBlur) => {
    if (done) return;
    done = true;
    if (commit && !applyInline(key, field, input.value)) {
      if (!fromBlur) { done = false; input.classList.add('bad'); input.focus(); return; }
    }
    replaceRow(key);
    if (move) {
      const nx = CURRENT[CURRENT.findIndex(x => x.key === key) + move];
      if (nx) startInline(nx.key, field);
    }
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'Tab') { e.preventDefault(); finish(true, e.shiftKey ? -1 : 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); finish(true, -1); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true, 0, true));
}
function applyInline(key, field, raw) {
  const p = BYKEY.get(key).p;
  if (field === 'mlId') {
    const res = parseMlId(raw);
    if (res.error) { toast(res.error); return false; }
    if ((res.id || null) === (p.mlId || null)) return true;
    update(key, {mlId:res.id, mlIdFuente:res.id ? 'manual' : null});
    toast(res.id ? res.id + ' asignado. El próximo chequeo leerá su precio.' : 'ID quitado');
  } else {
    const t = String(raw).trim();
    const v = t === '' ? null : Math.round(Number(t) * 100) / 100;
    if (v != null && (!isFinite(v) || v < 0)) { toast('Escribe un precio válido, por ejemplo 12999'); return false; }
    if (v === (p[field] ?? null)) return true;
    update(key, {[field]:v});
  }
  renderQueues();
  return true;
}

function numOrNull(v) { const t = String(v).trim(); if (t === '') return null; const n = Number(t); return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : undefined; }

function submitEdit(form, publish) {
  const key = form.dataset.key, r = BYKEY.get(key);
  if (!r) return closeOverlay();
  const p = r.p, o = form;
  const nombre = $('#e-nombre', o).value.trim();
  if (!nombre) { toast('El nombre no puede quedar vacío'); $('#e-nombre', o).focus(); return; }
  const id = parseMlId($('#e-mlid', o).value);
  if (id.error) { toast(id.error); $('#e-mlid', o).focus(); return; }
  const pml = numOrNull($('#e-pml', o).value), pamz = numOrNull($('#e-pamz', o).value);
  if (pml === undefined || pamz === undefined) { toast('Revisa los precios: deben ser números positivos'); return; }
  const next = {
    nombre, marca:$('#e-marca', o).value.trim(), activo:$('#e-activo', o).value === '1',
    linkML:$('#e-ml', o).value.trim() || null, linkAmz:$('#e-amz', o).value.trim() || null,
    mlId:id.id || null, precioML:pml, precioAmz:pamz,
    pausaML:$('#e-pausaml', o).value === '1', pausaAmz:$('#e-pausaamz', o).value === '1',
  };
  const fields = {};
  for (const [k, v] of Object.entries(next)) {
    if ((p[k] ?? null) === v) continue;
    if (k === 'activo' && (p.activo !== false) === v) continue;        // activo: ausente = activo
    if ((k === 'pausaML' || k === 'pausaAmz') && (p[k] || false) === v) continue; // pausa: ausente = no pausado
    fields[k] = v;
  }
  if ('mlId' in fields) fields.mlIdFuente = fields.mlId ? 'manual' : null;
  if ('linkML' in fields) Object.assign(fields, {_linkError:null, _linkRevisar:null, _linkSinProducto:null});
  const specInputs = o.querySelectorAll('[data-sk]');
  if (specInputs.length) {
    const especs = Object.assign({}, p.especs || {});
    let changed = false;
    specInputs.forEach(inp => {
      const sk = inp.dataset.sk, val = inp.value.trim(), prev = especs[sk];
      if (val === specText(p, sk)) return;
      changed = true;
      if (!val) delete especs[sk];
      else if (Array.isArray(prev)) especs[sk] = val.split(',').map(s => s.trim()).filter(Boolean);
      else especs[sk] = val;
    });
    if (changed) fields.especs = especs;
  }
  recalcCostos(p, fields);
  if (publish) {
    if (!next.linkML && !next.linkAmz) { toast('Agrega primero el link de afiliado para poder publicarla'); $('#e-ml', o).focus(); return; }
    Object.assign(fields, {activo:true, _publicar:true, estadoML:'sin_revisar'});
  }
  closeOverlay();
  if (!Object.keys(fields).length) { toast('Sin cambios'); return; }
  update(key, fields);
  replaceRow(key); renderQueues();
  toast(publish ? 'Lista para publicarse. Guarda y pide a Claude sincronizar (o espera al workflow).' : 'Cambios aplicados. Recuerda Guardar.');
}

function newId(cat, nombre) {
  const ids = (DB[cat] || []).map(p => p.id);
  const nums = ids.filter(x => typeof x === 'number');
  if (nums.length || !ids.length) return (nums.length ? Math.max(...nums) : 0) + 1;
  const base = norm(nombre).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'producto';
  let nid = base, i = 2;
  while (ids.includes(nid)) nid = base + '-' + (i++);
  return nid;
}

  });
  const cur = S.colf[sk];

  dd.style.left = Math.max(8, Math.min(rect.left - 20, window.innerWidth - dd.offsetWidth - 8)) + 'px';

function buildDocument(saveId) {
  const css = $('#css').textContent, js = $('#app-js').textContent, meta = $('#meta').textContent;
  const data = `<script type="application/json" id="meta">${meta}<\/script>\n<script type="application/json" id="db">${safeJson(DB)}<\/script>\n<script type="application/json" id="save">${safeJson(saveId)}<\/script>`;
  const page = `<title>${TITLE}</title>\n<style id="css">${css}</style>\n<div id="app"></div>\n${data}\n<script id="app-js">${js}<\/script>\n`;
  return `<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>${RESET}</style></head><body>\n${page}\n</body></html>`;
}
async function save() {
  if (SAVING || READONLY) return;
  if (!pendingCount()) { toast('No hay cambios por guardar'); return; }
  SAVING = true; renderStatus();
  const artifact = await use('artifact');
  if (!artifact) {
    SAVING = false; renderStatus();
    toast('Guardar no está disponible en esta vista. Tus cambios siguen en este navegador.');
    return;
  }
  const saveId = 'v-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
  PENDING.savingAs = saveId; lsSet(PKEY, PENDING);
  try {
    await artifact.publish(buildDocument(saveId));
    PENDING = emptyPending(); lsSet(PKEY, null);
    SAVING = false; renderStatus();
    toast('Guardado');
  } catch (e) {
    PENDING.savingAs = null; lsSet(PKEY, PENDING);
    SAVING = false;
    const code = e && e.code;
    if (code === 'conflict') toast('Había una versión más nueva. Se recarga y tus cambios se vuelven a aplicar; revisa y guarda otra vez.');
    else if (['not_writer', 'not_granted', 'not_declared', 'consent_required', 'capability_disabled', 'capability_removed'].includes(code)) { READONLY = true; toast('Esta vista es de solo lectura. Tus cambios quedan en este navegador.'); }
    else if (code === 'rate_limited') toast('Demasiados guardados seguidos. Espera unos segundos e intenta otra vez.');
    else toast('No se pudo guardar (' + (code || (e && e.message) || 'error') + '). Tus cambios siguen en este navegador.');
    renderStatus();
  }
}
function discardPending() {
  DB = readJson('db') || {};
  PENDING = emptyPending(); lsSet(PKEY, null);
  S.sel.clear(); HAY = new WeakMap();
  reindex(); renderAll();
  toast('Cambios descartados');
}

function exportRows(rows) {
  const out = {};
  for (const {cat, p} of rows) {
    (out[cat] = out[cat] || []).push({id:p.id, nombre:p.nombre, marca:p.marca, linkML:p.linkML || null, linkAmz:p.linkAmz || null, mlId:p.mlId || null,
      precioML:p.precioML ?? null, precioAmz:p.precioAmz ?? null, activo:p.activo !== false, especs:p.especs || undefined});
  }
  return JSON.stringify(out, null, 2);
}
function copyText(text, msg) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.append(ta); ta.select();
    try { document.execCommand('copy'); toast(msg); } catch (e) { toast('No se pudo copiar'); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(msg), fallback);
  else fallback();
}
function bulkActivo(on) {
  let n = 0;
  for (const key of S.sel) { const r = BYKEY.get(key); if (r && (r.p.activo !== false) !== on) { update(key, {activo:on}); n++; } }
  renderQueues(); renderTable();
  toast(n ? plural(n, 'producto', 'productos') + (on ? ' activados' : ' pausados') : 'Ya estaban así');
}
function saveUI() { lsSet(UKEY, {cat:S.cat, view:S.view}); }

// ── Eventos ─────────────────────────────────────────────────────────────────
function onClick(e) {
  const t = e.target;
  const dd = $('#dd');
  if (dd && !dd.contains(t) && !t.closest('[data-filter]')) closeDropdown();
  const menu = $('#menu');
  if (!menu.hidden && !t.closest('.menu')) { menu.hidden = true; $('[data-act="menu"]').setAttribute('aria-expanded', 'false'); }
  if (t === $('#overlay')) { closeOverlay(); return; }
  if (t.closest('[data-close]')) { closeOverlay(); return; }

  const cat = t.closest('[data-cat]');
  if (cat) { S.cat = cat.dataset.cat; S.colf = {}; S.sort = null; if (S.cat === 'todas' && S.view === 'specs') S.view = 'resumen'; saveUI(); renderCats(); renderQueues(); renderControls(); renderTable(); return; }
  const q = t.closest('[data-queue]');
  if (q) { S.queue = q.dataset.queue === S.queue && q.dataset.queue !== 'todos' ? 'todos' : q.dataset.queue; renderQueues(); renderTable(); return; }
  const plat = t.closest('[data-plat]');
  if (plat) { S.plat = plat.dataset.plat; renderControls(); renderTable(); return; }
  const view = t.closest('[data-view]');
  if (view && !view.disabled) { S.view = view.dataset.view; S.colf = {}; saveUI(); renderControls(); renderTable(); return; }
  const sort = t.closest('[data-sort]');
  if (sort) { const k = sort.dataset.sort; if (S.sort === k) S.dir = -S.dir; else { S.sort = k; S.dir = k === '_updatedAt' ? -1 : 1; } renderTable(); return; }
  const filt = t.closest('[data-filter]');
  if (filt) { if ($('#dd')) closeDropdown(); else openFilter(filt, filt.dataset.filter); return; }

  const a = t.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  const tr = a.closest('tr[data-key]');
  const key = tr && tr.dataset.key;
  switch (act) {
    case 'save': save(); break;
    case 'add': openAdd(); break;
    case 'menu': { const open = menu.hidden; menu.hidden = !open; a.setAttribute('aria-expanded', String(open)); break; }
    case 'copy-all': menu.hidden = true; copyText(exportRows(ROWS), 'JSON de ' + ROWS.length + ' productos copiado'); break;
    case 'download': menu.hidden = true; download(); break;
    case 'discard':
      if (a.dataset.confirm) { menu.hidden = true; delete a.dataset.confirm; discardPending(); }
      else { a.dataset.confirm = '1'; a.textContent = '¿Seguro? Clic otra vez para descartar ' + pendingCount(); setTimeout(() => { delete a.dataset.confirm; a.textContent = 'Descartar cambios sin guardar'; }, 4000); }
      break;
    case 'review': openReview(); break;
    case 'review-one': openReview(key); break;
    case 'inline': if (key) startInline(key, a.dataset.field); break;
    case 'toggle': if (key) { const on = BYKEY.get(key).p.activo === false; update(key, {activo:on}); replaceRow(key); renderQueues(); toast(on ? 'Activado en la web' : 'Pausado: se quita de la web al publicar'); } break;
    case 'edit': if (key) openEdit(key); break;
    case 'sel': if (key) { if (a.checked) S.sel.add(key); else S.sel.delete(key); tr.classList.toggle('is-sel', a.checked); renderSelbar(); const all = $('[data-act="sel-all"]'); if (all) all.checked = CURRENT.length > 0 && CURRENT.every(r => S.sel.has(r.key)); } break;
    case 'sel-all': CURRENT.forEach(r => a.checked ? S.sel.add(r.key) : S.sel.delete(r.key)); renderTable(); break;
    case 'sel-clear': S.sel.clear(); renderTable(); break;
    case 'bulk-pause': bulkActivo(false); break;
    case 'bulk-play': bulkActivo(true); break;
    case 'copy-sel': copyText(exportRows([...S.sel].map(k => BYKEY.get(k)).filter(Boolean)), 'JSON de ' + plural(S.sel.size, 'producto', 'productos') + ' copiado'); break;
    case 'del': $('#e-confirm').hidden = false; break;
    case 'del-no': $('#e-confirm').hidden = true; break;
    case 'del-yes': deleteProduct($('#f-edit').dataset.key); break;
    case 'publish': submitEdit($('#f-edit'), true); break;
    case 'rv-use': { const p = BYKEY.get(RV.list[RV.i]).p, c = p._mlSug[+a.dataset.i]; if (c) rvAssign(c.id, c.p); break; }
    case 'rv-skip': RV.i++; renderReview(); break;
    case 'rv-prev': RV.i = Math.max(0, RV.i - 1); while (RV.i > 0 && BYKEY.get(RV.list[RV.i]) && BYKEY.get(RV.list[RV.i]).p.mlId) RV.i--; renderReview(); break;
    case 'rv-none': rvNone(); break;
  }
}
async function download() {
  if (!DL) { toast('Las descargas no están disponibles en esta vista'); return; }
  try { await DL.save({filename:'merged-admin.json', data:JSON.stringify(DB, null, 2)}); toast('merged-admin.json listo'); }
  catch (e) { if (!e || e.code !== 'declined') toast('No se pudo descargar (' + ((e && e.code) || 'error') + ')'); }
}
function onSubmit(e) {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'f-edit') submitEdit(f);
  else if (f.id === 'f-add') submitAdd(f);
  else if (f.id === 'f-rv') {
    const res = parseMlId($('#rv-input').value);
    const msg = $('#rv-msg');
    if (res.error || !res.id) { msg.className = 'field-msg bad'; msg.textContent = res.error || 'Pega una URL o un ID'; return; }
    rvAssign(res.id, null);
  }
}
function onInput(e) {
  const t = e.target;
  if (t.id === 'q') { clearTimeout(onInput.t); onInput.t = setTimeout(() => { S.q = t.value; renderTable(); }, 120); }
  else if (t.id === 'e-mlid') mlIdMessage(t, $('#e-mlid-msg'));
  else if (t.id === 'a-mlid') mlIdMessage(t, $('#a-mlid-msg'));
  else if (t.id === 'e-amz') amzMessage(t, $('#e-amz-msg'));
  else if (t.id === 'a-amz') amzMessage(t, $('#a-amz-msg'));
}
function onKey(e) {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }
  if (e.key === 'Escape') {
    if (closeDropdown()) return;
    if (OVERLAY) { closeOverlay(); return; }
    const menu = $('#menu'); if (!menu.hidden) { menu.hidden = true; return; }
    if (S.sel.size) { S.sel.clear(); renderTable(); }
    return;
  }
  if (OVERLAY === 'review' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const p = BYKEY.get(RV.list[RV.i]) && BYKEY.get(RV.list[RV.i]).p;
    if (!p) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && Array.isArray(p._mlSug) && p._mlSug[n - 1]) { e.preventDefault(); rvAssign(p._mlSug[n - 1].id, p._mlSug[n - 1].p); }
    else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowRight') { e.preventDefault(); RV.i++; renderReview(); }
    else if (e.key === 'x' || e.key === 'X') { e.preventDefault(); rvNone(); }
    else if (e.key === 'ArrowLeft' && RV.i > 0) { e.preventDefault(); RV.i--; renderReview(); }
    return;
  }
  if (!typing && !OVERLAY && e.key === '/') { e.preventDefault(); $('#q').focus(); }
}

// ── Arranque ────────────────────────────────────────────────────────────────
document.getElementById('app').innerHTML = SHELL;
document.addEventListener('click', onClick);
document.addEventListener('submit', onSubmit);
document.addEventListener('input', onInput);
document.addEventListener('keydown', onKey);
renderAll();
renderFoot();
if (!ROWS.length) $('#empty').textContent = 'No se pudieron leer los datos de productos.';
if (restored) toast((restored === 1 ? 'Se recuperó ' : 'Se recuperaron ') + plural(restored, 'cambio sin guardar', 'cambios sin guardar') + ' de tu sesión anterior');
use('downloads').then(d => { DL = d; $('#mi-download').hidden = !d; });
})();
</script>

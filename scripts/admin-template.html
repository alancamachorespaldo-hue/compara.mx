<title>Gestión Productos</title>
<style id="css">
/* Layout: barra de acciones fija → categorías → colas de trabajo → tabla densa editable en línea */
:root{
  --bg:#f4f6f5;--surface:#ffffff;--surface-2:#eef2f0;--line:#d9e0dc;--line-soft:#e7ece9;
  --fg:#15211b;--fg-2:#53625b;--fg-3:#7b8882;
  --accent:#006847;--accent-hover:#00573b;--accent-fg:#ffffff;--accent-soft:#e1f0e8;
  --ok:#1a7f43;--ok-soft:#e2f3e7;--warn:#9a5600;--warn-soft:#fbf0dc;--err:#bf3328;--err-soft:#fbe8e6;--info:#2350c0;--info-soft:#e6ecfb;
  --ml:#ffe600;--ml-fg:#2d3277;--amz:#ff9900;--amz-fg:#3d2200;
  --scrim:rgba(12,24,18,.45);--shadow:0 12px 40px rgba(16,32,24,.18);
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-data:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
  --radius:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1311;--surface:#151c19;--surface-2:#1c2521;--line:#2a3530;--line-soft:#212b27;
  --fg:#e3ebe7;--fg-2:#9caba3;--fg-3:#74837c;
  --accent:#37b680;--accent-hover:#48c791;--accent-fg:#04140d;--accent-soft:#12302a;
  --ok:#4cc77e;--ok-soft:#10291b;--warn:#f0b04a;--warn-soft:#2c2212;--err:#f07a70;--err-soft:#331614;--info:#88a9ff;--info-soft:#16213d;
  --ml:#ffe600;--ml-fg:#1e2257;--amz:#ff9900;--amz-fg:#2a1700;
  --scrim:rgba(0,0,0,.6);--shadow:0 12px 40px rgba(0,0,0,.5);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1311;--surface:#151c19;--surface-2:#1c2521;--line:#2a3530;--line-soft:#212b27;
  --fg:#e3ebe7;--fg-2:#9caba3;--fg-3:#74837c;
  --accent:#37b680;--accent-hover:#48c791;--accent-fg:#04140d;--accent-soft:#12302a;
  --ok:#4cc77e;--ok-soft:#10291b;--warn:#f0b04a;--warn-soft:#2c2212;--err:#f07a70;--err-soft:#331614;--info:#88a9ff;--info-soft:#16213d;
  --ml:#ffe600;--ml-fg:#1e2257;--amz:#ff9900;--amz-fg:#2a1700;
  --scrim:rgba(0,0,0,.6);--shadow:0 12px 40px rgba(0,0,0,.5);color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--font-data);font-size:12px}
.muted{color:var(--fg-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font-family:var(--font-data);font-size:11px;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;color:var(--fg-2);background:var(--surface-2)}

/* Barra superior */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand b{font-size:15px;color:var(--accent);letter-spacing:-.01em}
.brand span{color:var(--fg-2);font-size:13px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg-2)}
.status.dirty{color:var(--warn);font-weight:600}
.status .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-danger{background:var(--err);border-color:var(--err);color:var(--surface)}
.btn-ghost-danger{background:transparent;border-color:transparent;color:var(--err)}
.btn-ghost-danger:hover{background:var(--err-soft)}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.pill{font-family:var(--font-data);font-size:11px;padding:0 6px;border-radius:9px;background:color-mix(in srgb,var(--accent-fg) 22%,transparent)}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);z-index:60;min-width:240px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow);display:grid}
.menu-list button,.menu-list a{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--fg)}
.menu-list button:hover,.menu-list button:focus-visible,.menu-list a:hover,.menu-list a:focus-visible{background:var(--surface-2)}
.menu-list .danger{color:var(--err)}

/* Categorías y colas */
.cats{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:thin}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip .n{font-family:var(--font-data);font-size:11px;color:var(--fg-3)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.queues{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;padding:8px 16px}
.q{display:flex;flex-direction:column;gap:1px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.q:hover{border-color:var(--fg-3)}
.q[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.q .lbl{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-2)}
.q .num{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tone-warn .num{color:var(--warn)}.tone-err .num{color:var(--err)}.tone-ok .num{color:var(--ok)}.tone-info .num{color:var(--info)}
.callout{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:4px 16px 8px;padding:10px 14px;border-radius:var(--radius);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.callout p{margin:0;flex:1 1 320px;min-width:0}

/* Barra de herramientas */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:4px 16px 10px}
.search{position:relative;flex:1 1 260px;min-width:0}
.search input{width:100%;height:34px;padding:0 36px 0 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--fg);font:inherit}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.seg button{height:32px;padding:0 10px;border:0;background:transparent;color:var(--fg-2);font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.seg button:disabled{opacity:.45;cursor:default}
.meta{font-size:12.5px;color:var(--fg-2)}
.meta a{color:var(--accent);font-weight:600}

/* Tabla */
.table-wrap{margin:0 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:auto;max-height:calc(100dvh - 120px)}
table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{position:sticky;top:0;z-index:2;padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-2);white-space:nowrap}
.th-sort{all:unset;cursor:pointer}
.th-sort:hover{color:var(--fg)}
.fbtn{all:unset;cursor:pointer;margin-left:4px;padding:0 3px;border-radius:3px;font-size:10px;color:var(--fg-3)}
.fbtn.on{color:var(--accent)}
td{padding:7px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;overflow-wrap:anywhere}
tbody tr:hover{background:var(--surface-2)}
tbody tr.is-sel{background:var(--accent-soft)}
tr.is-paused .name{color:var(--fg-3);text-decoration:line-through}
.c-num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.c-date{white-space:nowrap;font-size:12px;color:var(--fg-2)}
.name{font-weight:600;line-height:1.3}
.sub{margin-top:1px;font-size:11.5px;color:var(--fg-3)}
.cell-edit{all:unset;cursor:text;display:inline-block;min-width:64px;padding:3px 6px;border:1px dashed transparent;border-radius:5px;font-weight:600;font-variant-numeric:tabular-nums}
.cell-edit:hover{border-color:var(--line);background:var(--surface)}
.cell-edit:focus-visible{outline:2px solid var(--accent)}
.inline-input{width:110px;height:28px;padding:0 6px;border:1px solid var(--accent);border-radius:5px;background:var(--surface);color:var(--fg);font:inherit;font-variant-numeric:tabular-nums;text-align:right}
.inline-input.wide{width:230px;text-align:left;font-family:var(--font-data);font-size:12px}
.inline-input.bad{border-color:var(--err);background:var(--err-soft)}
.delta{display:block;font-size:11px;font-weight:700}
.delta.up{color:var(--err)}.delta.down{color:var(--ok)}
.mlid{font-family:var(--font-data);font-size:12px;color:var(--fg);text-decoration:none;padding:2px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface-2)}
.mlid:hover{border-color:var(--fg-3)}
.add-id{all:unset;cursor:pointer;padding:2px 7px;border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);border-radius:5px;font-size:12px;font-weight:600;color:var(--accent)}
.sug{all:unset;cursor:pointer;margin-right:4px;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;color:var(--info);background:var(--info-soft)}
.mini{all:unset;cursor:pointer;margin-left:4px;padding:0 4px;border-radius:4px;color:var(--fg-3);font-size:12px}
.mini:hover{color:var(--fg);background:var(--surface-2)}
.note-link{margin-top:3px;font-size:11.5px;font-weight:600;color:var(--warn)}
.note-link.bad{color:var(--err)}
.note-aff{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);white-space:nowrap}
.publish-box{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 14px;border-radius:10px;background:var(--info-soft)}
.publish-box p{margin:0;flex:1 1 280px;font-size:13px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-warn{background:var(--warn-soft);color:var(--warn)}.t-err{background:var(--err-soft);color:var(--err)}.t-info{background:var(--info-soft);color:var(--info)}.t-muted{background:var(--surface-2);color:var(--fg-2)}.t-neutral{background:var(--surface-2);color:var(--fg)}
.when{display:block;margin-top:2px;font-size:11px;color:var(--fg-3);white-space:nowrap}
.lk{display:inline-flex;align-items:center;height:22px;padding:0 7px;margin-right:4px;border-radius:5px;font-size:11px;font-weight:800;text-decoration:none}
.lk-ml{background:var(--ml);color:var(--ml-fg)}.lk-amz{background:var(--amz);color:var(--amz-fg)}
.lk-roto{background:var(--err-soft);color:var(--err);box-shadow:inset 0 0 0 1px currentColor;text-decoration:line-through}
.sw{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--fg-2)}
.sw::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sw.on{background:var(--ok-soft);color:var(--ok)}
.sw:focus-visible{outline:2px solid var(--accent)}
.btn-icon{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;color:var(--fg-2)}
.btn-icon:hover{background:var(--surface-2);color:var(--fg)}
.spec{font-size:12px}
.empty{padding:40px 16px;text-align:center;color:var(--fg-2)}
.foot{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:14px 16px 90px;font-size:12px;color:var(--fg-3)}

/* Selección múltiple */
.selbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:calc(100% - 32px);padding:8px 10px 8px 14px;border-radius:12px;background:var(--fg);color:var(--bg);box-shadow:var(--shadow)}
.selbar .btn{background:transparent;color:inherit;border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.selbar .btn:hover{background:color-mix(in srgb,var(--bg) 12%,transparent)}

/* Paneles */
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto;background:var(--scrim)}
.sheet{display:flex;flex-direction:column;gap:14px;width:100%;max-width:660px;margin:auto 0;padding:20px;border-radius:12px;background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.sheet.wide{max-width:840px}
.sheet:focus{outline:none}
.sheet-head{display:flex;align-items:flex-start;gap:12px}
.sheet-head>div{flex:1;min-width:0}
.sheet-head h2{margin:0;font-size:17px;line-height:1.3;text-wrap:balance}
.sheet-head p{margin:3px 0 0;font-size:12.5px}
.sheet-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.span2{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-2)}
.field input,.field select{width:100%;min-width:0;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);font:inherit}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field-msg{min-height:1.2em;font-size:12px;color:var(--fg-3)}
.field-msg.ok{color:var(--ok)}.field-msg.bad{color:var(--err)}.field-msg.warn{color:var(--warn)}
fieldset.group{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;margin:0;padding:12px 14px 14px;border:1px solid var(--line);border-radius:10px}
fieldset.group legend{padding:0 6px;font-size:12.5px;font-weight:800}
.link-sm{font-size:12.5px;font-weight:600;color:var(--accent)}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:var(--err-soft);color:var(--err);font-weight:600}
.row{display:flex;gap:8px}
.row input{flex:1}

/* Revisión rápida de IDs */
.progress{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.rv-product{display:grid;gap:4px;padding:12px 14px;border-radius:10px;background:var(--surface-2)}
.rv-product h3{margin:0;font-size:16px;line-height:1.3;text-wrap:balance}
.rv-links{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px}
.rv-links a{color:var(--accent);font-weight:600}
.cands{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.cand{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:6px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.cand:hover{border-color:var(--fg-3)}
.cand-name{font-weight:600;line-height:1.3}
.cand-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:3px;font-size:12px;color:var(--fg-2)}
.cand-price{text-align:right;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.cand-price small{display:block;font-size:11px;font-weight:600;color:var(--fg-3)}
.cand-actions{display:flex;gap:6px}
.conf{font-weight:700}.conf-alta{color:var(--ok)}.conf-media{color:var(--warn)}.conf-baja{color:var(--fg-3)}
.note{margin:0;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--fg-2)}

/* Filtro por columna */
.dd{position:fixed;z-index:120;min-width:190px;max-width:280px;max-height:320px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow)}
.dd label{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;font-size:12.5px;cursor:pointer}
.dd label:hover{background:var(--surface-2)}
.dd-foot{position:sticky;bottom:-6px;display:flex;gap:6px;margin-top:4px;padding:6px 2px 2px;border-top:1px solid var(--line);background:var(--surface)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:200;max-width:min(560px,calc(100% - 32px));padding:10px 16px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;box-shadow:var(--shadow);opacity:0;transform:translate(-50%,12px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

.menu-only-phone{display:none}
@media (max-width:620px){
  .bar{gap:8px;padding:8px 16px}
  .brand span,.status,.bar-publish{display:none}
  .menu-list .menu-only-phone{display:block}
  .bar .btn{height:32px;padding:0 10px}
  .grid2,fieldset.group{grid-template-columns:1fr}
  .cand{grid-template-columns:auto minmax(0,1fr)}
  .cand-price{grid-column:2;text-align:left}
  .cand-actions{grid-column:1/-1}
  .table-wrap{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ── Generador de publicaciones ─────────────────────────────────────────── */
.pub-wrap{padding:16px;max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.pub-step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.pub-step-head{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700}
.pub-step-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:12px;font-weight:800;flex-shrink:0}
.pub-cat-grid{display:flex;flex-wrap:wrap;gap:6px}
.pub-cat-btn{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:background .12s,border-color .12s}
.pub-cat-btn:hover{background:var(--surface-2)}
.pub-cat-btn.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.pub-search-wrap{max-width:420px}
.pub-search-wrap input{width:100%;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--fg);font:inherit}
.pub-search-wrap input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.pub-prod-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;max-height:300px;overflow-y:auto;padding-right:2px}
.pub-prod-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;background:var(--surface);transition:border-color .12s,background .12s;user-select:none}
.pub-prod-item:hover{border-color:var(--fg-3);background:var(--surface-2)}
.pub-prod-item.on{border-color:var(--accent);background:var(--accent-soft)}
.pub-prod-item img{width:38px;height:38px;object-fit:contain;border-radius:4px;background:var(--surface-2);flex-shrink:0}
.pub-prod-item .pname{font-size:12.5px;font-weight:600;line-height:1.3;flex:1;min-width:0;word-break:break-word}

function vBarSvg(weeks, key, color, sel) {
  const W=380, H=120, BOTTOM=32, LEFT=4, RIGHT=4;
  const n = weeks.length;
  const gap = 10, barW = Math.floor((W - LEFT - RIGHT - (n-1)*gap) / n);
  const maxV = Math.max(...weeks.map(w=>w[key]), 1);
  const chartH = H - BOTTOM;
  let bars='', vals='', labels='';
  weeks.forEach((w,i) => {
    const v = w[key], bh = Math.max(Math.round(v/maxV*chartH), v?2:0);
    const x = LEFT + i*(barW+gap), y = chartH - bh;
    const dim = sel >= 0 && i !== sel;

    labels += `<text x="${x+barW/2}" y="${H-18}" text-anchor="middle" style="font-size:8px;fill:${txtCol}">${w.l.split('–')[0]}</text>`;

  });

}

function groupBarSvg(weeks, sel) {
  const W=380, H=120, BOTTOM=32, LEFT=4, RIGHT=4;

function hBarSvg(pages) {

    rows += `<text x="${LABEL_W+bw+5}" y="${y+ROW/2+4}" style="font-size:10px;fill:var(--fg-2);font-weight:600">${pg.u}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;overflow:visible">${rows}</svg>`;
}

function deltaBadge(curr, prev) {
  if (prev == null) return '';
  if (prev === 0) return curr > 0 ? '<span class="dash-tile-delta up">▲ nuevo</span>' : '';
  const pct = Math.round((curr - prev) / prev * 100);
  if (pct === 0) return '<span class="dash-tile-delta fl">→ 0%</span>';
  return `<span class="dash-tile-delta ${pct>0?'up':'dn'}">${pct>0?'▲':'▼'} ${Math.abs(pct)}%</span>`;
}
function evtsSvg(wk) {
  const EVT_LBL = {page_view:'page_view',scroll:'scroll',first_visit:'first_visit',session_start:'session_start',comparison_section_view:'comp._section',affiliate_click_ml:'aff. ML',affiliate_click_amazon:'aff. Amazon'};
  const EVT_COL = {page_view:'var(--info)',scroll:'var(--accent)',first_visit:'var(--ok)',session_start:'var(--fg-3)',comparison_section_view:'var(--amz)',affiliate_click_ml:'var(--ml)',affiliate_click_amazon:'var(--amz)'};
  const entries = Object.entries(wk.evts||{}).sort((a,b)=>b[1]-a[1]).slice(0,7);
  if (!entries.length) return '<p class="muted" style="font-size:12px;margin:0">Sin datos de eventos.</p>';
  const ROW=20, GAP=4, W=400, LW=110, NW=32, BZ=W-LW-NW-8;
  const maxV = Math.max(...entries.map(e=>e[1]), 1);
  const H = entries.length*(ROW+GAP)-GAP;
  let rows='';
  entries.forEach(([k,v],i)=>{
    const y=i*(ROW+GAP), bw=Math.max(Math.round(v/maxV*BZ),2);
    rows+=`<text x="${LW-4}" y="${y+ROW/2+4}" text-anchor="end" style="font-size:9.5px;fill:var(--fg-2)">${EVT_LBL[k]||k}</text>`;
    rows+=`<rect x="${LW}" y="${y}" width="${bw}" height="${ROW}" rx="3" style="fill:${EVT_COL[k]||'var(--accent)'}"/>`;
    rows+=`<text x="${LW+bw+5}" y="${y+ROW/2+4}" style="font-size:9.5px;fill:var(--fg-2);font-weight:600">${v}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;overflow:visible">${rows}</svg>`;
}

function buildUtmUrl() {
  const base = 'https://comparalo.mx';
  const page = ($('#utm-page') && $('#utm-page').value) || '/';
  const src = ($('#utm-source') && $('#utm-source').value.trim()) || '';
  const med = ($('#utm-medium') && $('#utm-medium').value.trim()) || '';
  const cam = ($('#utm-campaign') && $('#utm-campaign').value.trim()) || '';
  const con = ($('#utm-content') && $('#utm-content').value.trim()) || '';
  if (!src && !med) { const out=$('#utm-out'); if(out) out.value=''; return; }
  const p = new URLSearchParams();
  if (src) p.set('utm_source', src);
  if (med) p.set('utm_medium', med);
  if (cam) p.set('utm_campaign', cam);
  if (con) p.set('utm_content', con);
  const out = $('#utm-out');
  if (out) out.value = base + page + '?' + p.toString();
}
function applyUtmPreset(key) {
  const pr = UTM_PRESETS[key]; if (!pr) return;
  const s=$('#utm-source'), m=$('#utm-medium'), c=$('#utm-campaign');
  if (s) s.value = pr.source;
  if (m) m.value = pr.medium;
  if (c) c.value = pr.campaign;
  document.querySelectorAll('[data-utm]').forEach(b => b.classList.toggle('on', b.dataset.utm===key));
  buildUtmUrl();
}

function parseMlId(raw) {
  const s = String(raw || '').trim();

  if (/meli\.la\//i.test(s)) return {error:'Los links meli.la no traen el ID. Abre el producto en Mercado Libre y copia la URL de la ficha (…/p/MLM…).'};
  const cat = s.match(/\/p\/(MLM\d{6,12})/i);
  if (cat) return {id:cat[1].toUpperCase()};
  if (/\/up\/MLMU/i.test(s)) return {error:'Ese link es de una variante (MLMU…). Usa la URL de la ficha de catálogo (…/p/MLM…).'};
  if (/MLM-\d{6,}/i.test(s) || /articulo\.mercadolibre/i.test(s)) return {error:'Es el link de una publicación (MLM-…). La API solo da precio con la ficha de catálogo: busca la URL que contiene /p/MLM….'};
  const bare = s.match(/^(?:MLM)?(\d{6,12})$/i);

}

const aNum = v => { const m = String(v ?? '').replace(/,/g, '').match(/-?[\d.]+/); return m ? parseFloat(m[0]) : null; };
const comoEstaba = (antes, n) => typeof antes === 'string' && antes.trim().startsWith('$') ? '$' + n.toFixed(2) : +n.toFixed(2);

function costosPlataforma(precioML, precioAmz, especs) {
  const e = especs || {}, porciones = aNum(e.porciones), prot = aNum(e.proteinaPorPorcion), gr = aNum(e.contenidoGramos), ui = aNum(e.ui);
  const calc = precio => {
    if (!(precio > 0)) return null;
    const porc = porciones > 0 ? precio / porciones : null;
    return {
      costoPorPorcion: porc,
      costoPor25g: (porc != null && prot > 0) ? porc * 25 / prot : null,
      costoPor5g: gr > 0 ? precio / (gr / 5) : null,
      costoPor1000ui: (porc != null && ui > 0) ? porc / (ui / 1000) : null,
    };
  };
  return { ml: calc(aNum(precioML)), amz: calc(aNum(precioAmz)) };
}

function costoDualHTML(sk, precioML, precioAmz, especs, sep) {
  const c = costosPlataforma(precioML, precioAmz, especs);
  const ml = c.ml && c.ml[sk], amz = c.amz && c.amz[sk], parts = [];
  if (ml != null) parts.push(`<span style="white-space:nowrap"><span class="muted" style="font-size:10px">ML</span> ${fmtCosto(ml)}</span>`);
  if (amz != null) parts.push(`<span style="white-space:nowrap"><span class="muted" style="font-size:10px">AMZ</span> ${fmtCosto(amz)}</span>`);
  return parts.length ? parts.join(sep || '<br>') : '<span class="muted">—</span>';
}

function recalcCostos(p, fields) {
  const antes = p.especs || {};
  const especs = fields.especs || antes;
  const cambioPrecio = 'precioML' in fields || 'precioAmz' in fields;
  const cambioPorciones = aNum(especs.porciones) !== aNum(antes.porciones);
  if (!cambioPrecio && !cambioPorciones) return;
  // El costo sigue al precio que se acaba de editar: si tocas el de Amazon, se calcula con ese;
  // si no cambió ningún precio (solo porciones), se usa el vigente (ML si hay, si no Amazon).
  const nuevoML = 'precioML' in fields ? fields.precioML : p.precioML;
  const nuevoAmz = 'precioAmz' in fields ? fields.precioAmz : p.precioAmz;
  const base = ('precioML' in fields && fields.precioML) ? fields.precioML
    : ('precioAmz' in fields && fields.precioAmz) ? fields.precioAmz
    : (nuevoML ?? nuevoAmz);
  const porciones = aNum(especs.porciones);
  if (!base || !porciones) return;
  const next = Object.assign({}, especs);
  const porPorcion = base / porciones;
  if (antes.costoPorPorcion != null) next.costoPorPorcion = comoEstaba(antes.costoPorPorcion, porPorcion);
  const ui = aNum(especs.ui);
  if (antes.costoPor1000ui != null && ui) next.costoPor1000ui = comoEstaba(antes.costoPor1000ui, porPorcion / (ui / 1000));
  fields.especs = next;
}

  <div class="seg" id="plat" role="group" aria-label="Tienda"><button data-plat="">Todas</button><button data-plat="ml">Con ML</button><button data-plat="amz">Con Amazon</button><button data-plat="ambas">Ambas</button></div>
  <div class="seg" id="view" role="group" aria-label="Vista"><button data-view="resumen">Resumen</button><button data-view="specs">Especificaciones</button></div>

</div>
<div class="table-wrap" id="table-wrap"><table id="table"><colgroup id="cg"></colgroup><thead id="thead"></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty" hidden>Nada coincide con estos filtros.</div></div>
<p class="foot" id="foot"></p>
<div class="selbar" id="selbar" hidden></div>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>`;

// ── Render ──────────────────────────────────────────────────────────────────
function renderStatus() {
  const n = pendingCount(), el = $('#status'), b = $('#btn-save');
  if (READONLY) { el.className = 'status'; el.textContent = 'Solo lectura: los cambios quedan en este navegador'; }
  else if (SAVING) { el.className = 'status'; el.textContent = 'Guardando…'; }
  else if (LAST_ERR) { el.className = 'status dirty'; el.innerHTML = '<i class="dot"></i>' + esc(LAST_ERR) + (n ? ' · ' + esc(plural(n, 'cambio sin guardar', 'cambios sin guardar')) : ''); }
  else if (n) { el.className = 'status dirty'; el.innerHTML = '<i class="dot"></i>' + esc(plural(n, 'cambio sin guardar', 'cambios sin guardar')); }
  else { el.className = 'status'; el.textContent = 'Todo guardado'; }
  b.disabled = !n || SAVING || READONLY;
  b.innerHTML = SAVING ? 'Guardando…' : 'Guardar' + (n ? ' <span class="pill">' + n + '</span>' : '');
  $('#mi-discard').hidden = !n;
}

function renderCats() {
  const counts = {};
  for (const r of ROWS) counts[r.cat] = (counts[r.cat] || 0) + 1;
  const keys = ['todas', ...Object.keys(CATS).filter(k => DB[k]), ...Object.keys(DB).filter(k => !CATS[k])];
  $('#cats').innerHTML = keys.map(k => `<button class="chip" data-cat="${esc(k)}" aria-pressed="${S.cat === k}">${esc(k === 'todas' ? 'Todas' : (CATS[k] || k))}<span class="n">${k === 'todas' ? ROWS.length : (counts[k] || 0)}</span></button>`).join('');
}

function baseRows() { return S.cat === 'todas' ? ROWS : ROWS.filter(r => r.cat === S.cat); }

function renderQueues() {
  const base = baseRows();
  const counts = Object.fromEntries(QUEUES.map(q => [q.k, 0]));
  let mlTotal = 0, mlWithId = 0;
  for (const r of base) {
    for (const q of QUEUES) if (q.f(r.p)) counts[q.k]++;
    if (r.p.linkML) { mlTotal++; if (r.p.mlId) mlWithId++; }
  }
  $('#queues').innerHTML = QUEUES.filter(q => !q.optional || counts[q.k] || S.queue === q.k).map(q =>
    `<button class="q tone-${q.tone || 'none'}" data-queue="${q.k}" aria-pressed="${S.queue === q.k}"><span class="lbl">${q.l}</span><span class="num">${counts[q.k]}</span></button>`).join('');
  const n = counts.falta_id, s = counts.sugerencias;
  const callouts = [];
  if (n) callouts.push(`<div class="callout"><p><b>${n}</b> de ${mlTotal} productos con link de Mercado Libre no ${n === 1 ? 'tiene' : 'tienen'} ID de catálogo, así que el actualizador no puede leer su precio${mlWithId ? ` (${mlWithId} ya lo tienen)` : ''}.${s ? ` <b>${s}</b> ya tienen candidatos listos para confirmar.` : ''}</p><button class="btn btn-primary" data-act="review">Asignar IDs</button></div>`);
  const la = counts.listos_activar;
  if (la) callouts.push(`<div class="callout"><p><b>${la}</b> ${la === 1 ? 'producto pausado ya tiene' : 'productos pausados ya tienen'} su link y precio de Amazon completos.</p><button class="btn btn-primary" data-act="activar-listos">Activar ${la === 1 ? '' : 'todos'}</button></div>`);
  const ap = counts.activados_pend;
  if (ap) callouts.push(`<div class="callout"><p><b>${ap}</b> ${ap === 1 ? 'producto activado espera' : 'productos activados esperan'} refrescar su precio de Mercado Libre.</p><p class="muted" style="font-size:12px;flex-basis:100%">Pídele a Claude que actualice precios para que se quiten de esta lista.</p></div>`);
  $('#callout').innerHTML = callouts.join('');
}
function bulkActivarListos() {
  let n = 0;
  for (const r of ROWS) {
    const p = r.p;
    if (p.activo === false && p.linkAmz && hasTag(p.linkAmz) && p.precioAmz != null) { update(r.key, {activo:true, _activadoPendiente:true}); n++; }
  }
  renderCats(); renderQueues(); renderTable();
  toast(n ? plural(n, 'producto activado', 'productos activados') + '. Pide a Claude que actualice los precios de Mercado Libre.' : 'No hay productos listos para activar');
}

function specCols(cat) {
  if (SPECS[cat]) return SPECS[cat];
  const freq = {};
  for (const p of DB[cat] || []) for (const k of Object.keys(p.especs || {})) freq[k] = (freq[k] || 0) + 1;
  return Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k]) => [k, k.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase())]);
}
const specText = (p, sk) => { const v = (p.especs || {})[sk]; return Array.isArray(v) ? v.join(', ') : (v == null ? '' : String(v)); };

function columns() {
  const specs = S.view === 'specs' && S.cat !== 'todas' ? specCols(S.cat) : null;
  const cols = [{k:'chk', w:38}, {k:'nombre', l:'Producto', sort:'nombre', min:260}];
  if (specs) {
    cols.push({k:'precioML', l:'Precio ML', sort:'precioML', num:true, w:112}, {k:'precioAmz', l:'Precio AMZ', sort:'precioAmz', num:true, w:112});
    for (const [sk, l] of specs) cols.push({k:'spec', sk, l, sort:'spec:' + sk, filter:true, w:132});
    cols.push({k:'web', l:'Web', sort:'activo', w:108}, {k:'edit', w:46});
  } else {
    cols.push({k:'mlId', l:'Catálogo ML', sort:'mlId', w:184}, {k:'precioML', l:'Precio ML', sort:'precioML', num:true, w:112}, {k:'precioAmz', l:'Precio AMZ', sort:'precioAmz', num:true, w:112},
      {k:'estado', l:'Estado ML', sort:'estado', w:122}, {k:'links', l:'Links', w:124}, {k:'upd', l:'Modificado', sort:'_updatedAt', w:100}, {k:'web', l:'Web', sort:'activo', w:108}, {k:'edit', w:46});
  }
  return cols;
}

const SORTERS = {
  nombre:r => norm(r.p.nombre), mlId:r => r.p.mlId || null, precioML:r => r.p.precioML ?? null, precioAmz:r => r.p.precioAmz ?? null,
  estado:r => status(r.p), _updatedAt:r => r.p._updatedAt || null, activo:r => r.p.activo === false ? 1 : 0,
};
function sortValue(r, key) {
  if (key.startsWith('spec:')) { const t = specText(r.p, key.slice(5)); if (!t) return null; const n = parseFloat(t.replace(',', '.')); return isNaN(n) ? norm(t) : n; }
  return SORTERS[key](r);
}

function visible() {
  const terms = norm(S.q).split(/\s+/).filter(Boolean);
  const qf = QF[S.queue] || QF.todos;
  const colf = Object.entries(S.colf);
  const out = [];
  for (const r of ROWS) {
    if (S.cat !== 'todas' && r.cat !== S.cat) continue;
    const p = r.p;
    if (!qf(p)) continue;
    if (S.plat === 'ml' && !p.linkML) continue;
    if (S.plat === 'amz' && !p.linkAmz) continue;
    if (S.plat === 'ambas' && !(p.linkML && p.linkAmz)) continue;
    if (terms.length) { const h = hay(r); if (!terms.every(t => h.includes(t))) continue; }
    if (colf.length && !colf.every(([sk, set]) => set.has(specText(p, sk)))) continue;
    out.push(r);
  }
  if (S.sort) {
    const d = S.dir;
    const keyed = out.map(r => [sortValue(r, S.sort), r]);
    keyed.sort((a, b) => {
      if (a[0] == null && b[0] == null) return 0;
      if (a[0] == null) return 1;
      if (b[0] == null) return -1;
      return (typeof a[0] === 'number' && typeof b[0] === 'number' ? a[0] - b[0] : String(a[0]).localeCompare(String(b[0]), 'es')) * d;
    });
    return keyed.map(x => x[1]);
  }
  return out;
}

function renderHead() {
  $('#cg').innerHTML = COLS.map(c => c.w ? `<col style="width:${c.w}px">` : '<col>').join('');
  $('#table').style.minWidth = COLS.reduce((s, c) => s + (c.w || c.min || 0), 0) + 'px';
  const allSel = CURRENT.length > 0 && CURRENT.every(r => S.sel.has(r.key));
  $('#thead').innerHTML = '<tr>' + COLS.map(c => {
    if (c.k === 'chk') return `<th class="c-chk"><input type="checkbox" data-act="sel-all" aria-label="Seleccionar los productos visibles"${allSel ? ' checked' : ''}></th>`;
    if (c.k === 'edit') return '<th><span class="sr">Editar</span></th>';
    const arrow = S.sort === c.sort ? (S.dir > 0 ? ' ↑' : ' ↓') : '';
    const lbl = c.sort ? `<button class="th-sort" data-sort="${esc(c.sort)}">${esc(c.l)}${arrow}</button>` : esc(c.l);
    const f = c.filter ? `<button class="fbtn${S.colf[c.sk] ? ' on' : ''}" data-filter="${esc(c.sk)}" aria-label="Filtrar ${esc(c.l)}">▾</button>` : '';
    return `<th class="${c.num ? 'c-num' : ''}">${lbl}${f}</th>`;
  }).join('') + '</tr>';
}

function priceCell(p, field) {
  const v = p[field];
  let delta = '';
  if (field === 'precioML' && p._precioMLAntes && v && p.estadoML === 'actualizado') {
    const pct = (v - p._precioMLAntes) / p._precioMLAntes * 100;
    if (Math.abs(pct) >= 0.05) delta = `<span class="delta ${pct > 0 ? 'up' : 'down'}">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct).toFixed(1)}%</span>`;
  }
  return `<button class="cell-edit" data-act="inline" data-field="${field}" title="Editar ${field === 'precioML' ? 'precio ML' : 'precio Amazon'}">${v != null ? money(v) : '<span class="muted">—</span>'}</button>${delta}`;
}
function mlIdCell(p) {
  if (p.mlId) return `<a class="mlid" href="${safeUrl(catalogUrl(p.mlId))}" target="_blank" rel="noopener" title="Abrir la ficha en Mercado Libre">${esc(p.mlId)}</a><button class="mini" data-act="inline" data-field="mlId" title="Cambiar ID">✎</button>`;
  if (!p.linkML) return '<span class="muted">—</span>';
  const n = Array.isArray(p._mlSug) ? p._mlSug.length : 0;
  return (n ? `<button class="sug" data-act="review-one" title="Ver candidatos">${plural(n, 'candidato', 'candidatos')}</button>` : '') + '<button class="add-id" data-act="inline" data-field="mlId">+ ID</button>';
}
function stateCell(p) {
  const st = status(p), [l, tone] = ST[st] || [st, 'muted'];
  let sub = '';
  if (st === 'precio_sospechoso' && p._precioMLSospechoso) sub = 'ML marca ' + money(p._precioMLSospechoso);
  else if (st === 'nuevo' && p._nuevo) sub = '#' + p._nuevo.ranking + ' en ventas' + (p._nuevo.full ? ' · Full' : '');
  else if (p.mlId && p._mlCheckedAt) sub = 'rev. ' + fmtShort(p._mlCheckedAt);
  const pausaBadge = (p.pausaML && st !== 'no_encontrado')
    ? '<span class="badge t-err" style="margin-left:4px" title="Oculto en la web automáticamente">⏸ ML</span>'
    : '';
  return `<span class="badge t-${tone}">${esc(l)}</span>${pausaBadge}${sub ? `<span class="when">${esc(sub)}</span>` : ''}`;
}
function rowHtml(r) {
  const p = r.p, on = p.activo !== false, sel = S.sel.has(r.key);
  const cells = COLS.map(c => {
    switch (c.k) {
      case 'chk': return `<td class="c-chk"><input type="checkbox" data-act="sel" aria-label="Seleccionar"${sel ? ' checked' : ''}></td>`;
      case 'nombre': return `<td><div class="name">${esc(p.nombreCorto || p.nombre)}${needsAff(p) ? ' <span class="note-aff">⚠ Falta link de afiliado</span>' : ''}</div>${p.nombreCorto ? `<div class="sub" style="font-style:italic">${esc(p.nombre)}</div>` : ''}${linkNote(p)}<div class="sub">${esc(p.marca || '')}${S.cat === 'todas' ? ' · ' + esc(CATS[r.cat] || r.cat) : ''} · id ${esc(p.id)}</div></td>`;
      case 'mlId': return `<td data-cell="mlId" style="white-space:nowrap">${mlIdCell(p)}</td>`;
      case 'precioML': case 'precioAmz': return `<td class="c-num" data-cell="${c.k}">${priceCell(p, c.k)}</td>`;
      case 'estado': return `<td>${stateCell(p)}</td>`;
      case 'links': return `<td style="white-space:nowrap">${p.linkML ? `<a class="lk ${(p.pausaML || mlRoto(p)) ? 'lk-roto' : 'lk-ml'}" href="${safeUrl(p.linkML)}" target="_blank" rel="noopener" title="${p.pausaML ? 'Pausado en ML (oculto en la web)' : esc(mlRoto(p) || '')}">ML${p.pausaML ? ' ⏸' : mlRoto(p) ? ' ⚠' : ''} ↗</a>` : ''}${p.linkAmz ? `<a class="lk ${p.pausaAmz ? 'lk-roto' : 'lk-amz'}" href="${safeUrl(p.linkAmz)}" target="_blank" rel="noopener" title="${p.pausaAmz ? 'Pausado en Amazon (oculto en la web)' : (hasTag(p.linkAmz) ? '' : 'Falta el tag de afiliado')}">AMZ${p.pausaAmz ? ' ⏸' : hasTag(p.linkAmz) ? '' : ' ⚠'} ↗</a>` : ''}${!p.linkML && !p.linkAmz ? '<span class="muted">—</span>' : ''}</td>`;
      case 'upd': return `<td class="c-date">${p._updatedAt ? esc(fmtShort(p._updatedAt)) : '<span class="muted">—</span>'}</td>`;
      case 'web': return p.estadoML === 'nuevo' ? '<td><span class="badge t-info">Sin publicar</span></td>' : `<td><button class="sw${on ? ' on' : ''}" data-act="toggle" aria-pressed="${on}">${on ? 'Activo' : 'Pausado'}</button></td>`;
      case 'edit': return '<td><button class="btn-icon" data-act="edit" aria-label="Editar producto">✎</button></td>';
      case 'spec': {
        if (COSTO_KEYS[c.sk]) return `<td><span class="spec" style="line-height:1.4">${costoDualHTML(c.sk, p.precioML, p.precioAmz, p.especs, ' · ')}</span></td>`;
        const t = specText(p, c.sk); return `<td>${t ? `<span class="spec">${esc(t)}</span>` : '<span class="muted">—</span>'}</td>`;
      }
    }
    return '<td></td>';
  }).join('');
  return `<tr data-key="${esc(r.key)}" class="${on || p.estadoML === 'nuevo' ? '' : 'is-paused'}${sel ? ' is-sel' : ''}">${cells}</tr>`;
}

// Las primeras filas se pintan de inmediato y el resto llega por bloques, para no bloquear la página con el layout de toda la tabla.
const FIRST_CHUNK = 50, CHUNK = 120;
let renderToken = 0;
function renderTable() {
  COLS = columns();
  CURRENT = visible();
  renderHead();
  const token = ++renderToken, tbody = $('#tbody');
  tbody.innerHTML = CURRENT.slice(0, FIRST_CHUNK).map(rowHtml).join('');
  const more = from => {
    if (token !== renderToken || from >= CURRENT.length) return;
    tbody.insertAdjacentHTML('beforeend', CURRENT.slice(from, from + CHUNK).map(rowHtml).join(''));
    setTimeout(() => more(from + CHUNK), 16);
  };
  setTimeout(() => more(FIRST_CHUNK), 30);
  $('#empty').hidden = CURRENT.length > 0;
  $('#count').innerHTML = esc(plural(CURRENT.length, 'producto', 'productos')) + ` · <a href="${PRICE_WF}" target="_blank" rel="noopener">Actualizar precios Mercado Libre ↗</a>`;
  renderSelbar();
}
function rowEl(key) { return $('#tbody').querySelector(`tr[data-key="${CSS.escape(key)}"]`); }
function replaceRow(key) {
  const tr = rowEl(key), r = BYKEY.get(key);
  if (!tr) return;
  if (!r) { tr.remove(); return; }
  tr.outerHTML = rowHtml(r);
}

function renderSelbar() {
  const n = S.sel.size, el = $('#selbar');
  el.hidden = !n;
  if (!n) return;
  if (S.delPending) {

function startInline(key, field) {
  const tr = rowEl(key), r = BYKEY.get(key);
  if (!tr || !r) return;
  const td = tr.querySelector(`[data-cell="${field}"]`);
  if (!td) return;
  const isId = field === 'mlId';
  const input = document.createElement('input');
  input.className = 'inline-input' + (isId ? ' wide' : '');
  input.type = isId ? 'text' : 'number';
  if (!isId) { input.min = '0'; input.step = '1'; input.inputMode = 'decimal'; }
  input.value = isId ? (r.p.mlId || '') : (r.p[field] ?? '');
  input.placeholder = isId ? 'Pega el link de catálogo /p/MLM…' : '0';
  input.setAttribute('aria-label', isId ? 'ID de catálogo de Mercado Libre' : (field === 'precioML' ? 'Precio ML' : 'Precio Amazon'));
  td.replaceChildren(input);
  input.focus(); input.select();
  let done = false;
  const finish = (commit, move, fromBlur) => {
    if (done) return;
    done = true;
    if (commit && !applyInline(key, field, input.value)) {
      if (!fromBlur) { done = false; input.classList.add('bad'); input.focus(); return; }
    }
    replaceRow(key);
    if (move) {
      const nx = CURRENT[CURRENT.findIndex(x => x.key === key) + move];
      if (nx) startInline(nx.key, field);
    }
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'Tab') { e.preventDefault(); finish(true, e.shiftKey ? -1 : 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); finish(true, -1); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true, 0, true));
}
function applyInline(key, field, raw) {
  const p = BYKEY.get(key).p;
  if (field === 'mlId') {
    const res = parseMlId(raw);
    if (res.error) { toast(res.error); return false; }
    if ((res.id || null) === (p.mlId || null)) return true;
    update(key, {mlId:res.id, mlIdFuente:res.id ? 'manual' : null});
    toast(res.id ? res.id + ' asignado. El próximo chequeo leerá su precio.' : 'ID quitado');
  } else {
    const t = String(raw).trim();
    const v = t === '' ? null : Math.round(Number(t) * 100) / 100;
    if (v != null && (!isFinite(v) || v < 0)) { toast('Escribe un precio válido, por ejemplo 12999'); return false; }
    if (v === (p[field] ?? null)) return true;
    update(key, {[field]:v});
  }
  renderQueues();
  return true;
}

function numOrNull(v) { const t = String(v).trim(); if (t === '') return null; const n = Number(t); return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : undefined; }

function submitEdit(form, publish) {
  const key = form.dataset.key, r = BYKEY.get(key);
  if (!r) return closeOverlay();
  const p = r.p, o = form;
  const nombre = $('#e-nombre', o).value.trim();
  if (!nombre) { toast('El nombre no puede quedar vacío'); $('#e-nombre', o).focus(); return; }
  const id = parseMlId($('#e-mlid', o).value);
  if (id.error) { toast(id.error); $('#e-mlid', o).focus(); return; }
  const pml = numOrNull($('#e-pml', o).value), pamz = numOrNull($('#e-pamz', o).value);
  if (pml === undefined || pamz === undefined) { toast('Revisa los precios: deben ser números positivos'); return; }
  const next = {
    nombre, nombreCorto:$('#e-nombre-corto', o).value.trim() || null, marca:$('#e-marca', o).value.trim(), activo:$('#e-activo', o).value === '1',
    linkML:$('#e-ml', o).value.trim() || null, linkAmz:$('#e-amz', o).value.trim() || null,
    mlId:id.id || null, precioML:pml, precioAmz:pamz,
    pausaML:$('#e-pausaml', o).value === '1', pausaAmz:$('#e-pausaamz', o).value === '1',
  };
  const fields = {};
  for (const [k, v] of Object.entries(next)) {
    if ((p[k] ?? null) === v) continue;
    if (k === 'activo' && (p.activo !== false) === v) continue;        // activo: ausente = activo
    if ((k === 'pausaML' || k === 'pausaAmz') && (p[k] || false) === v) continue; // pausa: ausente = no pausado
    fields[k] = v;
  }
  if ('mlId' in fields) fields.mlIdFuente = fields.mlId ? 'manual' : null;
  if ('linkML' in fields) Object.assign(fields, {_linkError:null, _linkRevisar:null, _linkSinProducto:null});
  const specInputs = o.querySelectorAll('[data-sk]');
  if (specInputs.length) {
    const especs = Object.assign({}, p.especs || {});
    let changed = false;
    specInputs.forEach(inp => {
      const sk = inp.dataset.sk, val = inp.value.trim(), prev = especs[sk];
      if (val === specText(p, sk)) return;
      changed = true;
      if (!val) delete especs[sk];
      else if (Array.isArray(prev)) especs[sk] = val.split(',').map(s => s.trim()).filter(Boolean);
      else especs[sk] = val;
    });
    if (changed) fields.especs = especs;
  }
  // Campos de ficha de producto (solo laptops)
  if (r.cat === 'laptops') {
    const ei=$('#e-imagen',o),ee=$('#e-estrellas',o),er=$('#e-resenas',o),ep=$('#e-precio',o);
    const img=(ei&&ei.value.trim())||null;
    const est=ee&&ee.value.trim()!==''?parseFloat(ee.value):null;
    const res=er&&er.value.trim()!==''?parseInt(er.value,10):null;
    const pre=ep&&ep.value.trim()!==''?Math.round(parseFloat(ep.value)):null;
    if(img!==(p.imagen||null)) fields.imagen=img;
    if(isFinite(est)&&est!==p.estrellas) fields.estrellas=est; else if(est===null&&p.estrellas!=null) fields.estrellas=null;
    if(isFinite(res)&&res!==p.resenas) fields.resenas=res; else if(res===null&&p.resenas!=null) fields.resenas=null;
    if(isFinite(pre)&&pre!==p.precio) fields.precio=pre; else if(pre===null&&p.precio!=null) fields.precio=null;
  }
  recalcCostos(p, fields);
  if (publish) {
    if (!next.linkML && !next.linkAmz) { toast('Agrega primero el link de afiliado para poder publicarla'); $('#e-ml', o).focus(); return; }
    Object.assign(fields, {activo:true, _publicar:true, estadoML:'sin_revisar'});
  }
  closeOverlay();
  if (!Object.keys(fields).length) { toast('Sin cambios'); return; }
  update(key, fields);
  replaceRow(key); renderQueues();
  toast(publish ? 'Lista para publicarse. Guarda y pide a Claude sincronizar (o espera al workflow).' : 'Cambios aplicados. Recuerda Guardar.');
}

function newId(cat, nombre) {
  const ids = (DB[cat] || []).map(p => p.id);
  const nums = ids.filter(x => typeof x === 'number');

  const base = norm(nombre).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'producto';
  let nid = base, i = 2;
  while (ids.includes(nid)) nid = base + '-' + (i++);
  return nid;
}

// ── Guardar ─────────────────────────────────────────────────────────────────
function buildDocument(saveId) {
  const css = $('#css').textContent, js = $('#app-js').textContent, meta = $('#meta').textContent;
  const data = `<script type="application/json" id="meta">${meta}<\/script>\n<script type="application/json" id="db">${safeJson(DB)}<\/script>\n<script type="application/json" id="save">${safeJson(saveId)}<\/script>`;
  const page = `<title>${TITLE}</title>\n<style id="css">${css}</style>\n<div id="app"></div>\n${data}\n<script id="app-js">${js}<\/script>\n`;
  return `<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>${RESET}</style></head><body>\n${page}\n</body></html>`;
}
async function save() {
  if (SAVING || READONLY) return;
  if (!pendingCount()) { toast('No hay cambios por guardar'); return; }
  clearTimeout(autosaveT);
  SAVING = true; LAST_ERR = ''; renderStatus();
  let artifact = await use('artifact');
  for (let i = 0; i < 4 && !artifact; i++) { await new Promise(res => setTimeout(res, 800)); artifact = await use('artifact'); }
  if (!artifact) {
    SAVING = false; LAST_ERR = 'Guardar no disponible todavía, reintentará solo';
    renderStatus();
    toast('Guardar no está disponible en esta vista todavía. Tus cambios siguen en este navegador; se reintentará solo.');
    scheduleAutosave();
    return;
  }
  const saveId = 'v-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
  PENDING.savingAs = saveId; lsSet(PKEY, PENDING);
  try {
    await artifact.publish(buildDocument(saveId));
    PENDING = emptyPending(); lsSet(PKEY, null);
    SAVING = false; renderStatus();
    toast('Guardado');
  } catch (e) {
    PENDING.savingAs = null; lsSet(PKEY, PENDING);
    SAVING = false;
    const code = e && e.code;
    if (code === 'conflict') {
      LAST_ERR = 'Había una versión más nueva: recargando para aplicar tus cambios sobre ella…';
      toast(LAST_ERR);
      renderStatus();
      setTimeout(() => location.reload(), 1400);
      return;
    }
    else if (['not_writer', 'not_granted', 'not_declared', 'consent_required', 'capability_disabled', 'capability_removed'].includes(code)) { READONLY = true; LAST_ERR = 'Solo lectura: tus cambios quedan en este navegador'; toast('Esta vista es de solo lectura. Tus cambios quedan en este navegador.'); }
    else if (code === 'rate_limited') { LAST_ERR = 'Demasiados guardados seguidos, reintentará solo'; toast('Demasiados guardados seguidos. Espera unos segundos e intenta otra vez.'); scheduleAutosave(); }
    else { LAST_ERR = 'No se pudo guardar (' + (code || (e && e.message) || 'error') + ')'; toast(LAST_ERR + '. Tus cambios siguen en este navegador.'); scheduleAutosave(); }
    renderStatus();
  }
}
function discardPending() {
  DB = readJson('db') || {};
  PENDING = emptyPending(); lsSet(PKEY, null);
  S.sel.clear(); HAY = new WeakMap();
  reindex(); renderAll();
  toast('Cambios descartados');
}

function exportRows(rows) {
  const out = {};
  for (const {cat, p} of rows) {
    (out[cat] = out[cat] || []).push({id:p.id, nombre:p.nombre, marca:p.marca, linkML:p.linkML || null, linkAmz:p.linkAmz || null, mlId:p.mlId || null,
      precioML:p.precioML ?? null, precioAmz:p.precioAmz ?? null, activo:p.activo !== false, especs:p.especs || undefined});
  }
  return JSON.stringify(out, null, 2);
}
function copyText(text, msg) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.append(ta); ta.select();
    try { document.execCommand('copy'); toast(msg); } catch (e) { toast('No se pudo copiar'); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(msg), fallback);
  else fallback();
}
function bulkActivo(on) {

const PANELS = ['#update', '#dash', '#importar', '#pegar', '#pub'];
function openPanel(sel, onShow) {

  btn.setAttribute('aria-pressed', String(show));

      break;

    if (S.sel.size) { S.sel.clear(); renderTable(); }

    const n = parseInt(e.key, 10);

    else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowRight') { e.preventDefault(); RV.i++; renderReview(); }

    else if (e.key === 'ArrowLeft' && RV.i > 0) { e.preventDefault(); RV.i--; renderReview(); }

let IMP_INIT = false;
function initImport() {
  if (IMP_INIT) return;
  IMP_INIT = true;
  const zone = $('#imp-drop'), fileInput = $('#imp-file');
  if (!zone || !fileInput) return;
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', e => { if (!zone.contains(e.relatedTarget)) zone.classList.remove('over'); });
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('over');
    const f = e.dataTransfer.files[0];
    if (f && /\.html?$/i.test(f.name)) loadImportFile(f);
    else toast('Selecciona un archivo .html');
  });
  zone.addEventListener('click', e => { if (e.target !== fileInput) fileInput.click(); });
  zone.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); fileInput.click(); } });
  fileInput.addEventListener('change', () => { const f=fileInput.files[0]; if(f) loadImportFile(f); });
}
function loadImportFile(file) {
  const reader = new FileReader();
  reader.onload = e => parseAmazonHtml(e.target.result);
  reader.onerror = () => toast('No se pudo leer el archivo');
  reader.readAsText(file, 'utf-8');
}
function parseAmazonHtml(html) {
  let doc;
  try { doc = new DOMParser().parseFromString(html, 'text/html'); }
  catch(e) { toast('Error al parsear el HTML'); return; }

  const nombre = (doc.querySelector('#productTitle,#title,h1.a-size-large') || {}).textContent?.trim() || '';

  const marcaEl = doc.querySelector('#bylineInfo a,#bylineInfo_feature_div a,.po-brand .a-span9,.po-brand td:last-child');
  let marca = marcaEl?.textContent?.trim().replace(/^Marca:\s*/i,'') || '';
  if (!marca && nombre) {
    const first = nombre.split(' ')[0];
    if (first && first.length > 1 && first.length < 20) marca = first;
  }

  let imagen = '';
  const imgEl = doc.querySelector('#landingImage,#main-image-container img,#imgTagWrappingLink img');
  if (imgEl) {
    imagen = imgEl.getAttribute('data-old-hires') || imgEl.src || '';
    if (!imagen) {
      const dynRaw = imgEl.getAttribute('data-a-dynamic-image') || '';
      const m = dynRaw.match(/"(https:[^"]+)"/); if(m) imagen = m[1];
    }
  }
  if (!imagen) {
    for (const s of doc.querySelectorAll('script')) {
      const m = s.textContent.match(/"large"\s*:\s*"(https:\/\/m\.media-amazon\.com\/images\/I\/[^"]+)"/);
      if (m) { imagen = m[1]; break; }
    }
  }

  let precio = '';
  for (const sel of ['#corePriceDisplay_desktop_feature_div .a-price .a-offscreen','.a-price .a-offscreen','#priceblock_ourprice','#price_inside_buybox']) {
    const el = doc.querySelector(sel);
    if (el) { precio = el.textContent.replace(/[^\d]/g,'').trim(); if(precio) break; }
  }

  let estrellas = '';
  for (const sel of ['#acrPopover .a-icon-alt','[data-hook="average-stars-rating-anywhere"] .a-icon-alt','#averageCustomerReviews .a-icon-alt']) {
    const el = doc.querySelector(sel);
    if (el) { const m = el.textContent.match(/[\d,.]+/); if(m){estrellas=m[0].replace(',','.');break;} }
  }

  let resenas = '';
  for (const sel of ['#acrCustomerReviewText','[data-hook="total-review-count"]','#acrCustomerReviewLink']) {
    const el = doc.querySelector(sel);
    if (el) { resenas = el.textContent.replace(/[^\d]/g,'').trim(); if(resenas) break; }
  }

  let linkAmz = doc.querySelector('link[rel="canonical"]')?.href || doc.querySelector('meta[property="og:url"]')?.content || '';
  if (!linkAmz.includes('amazon.com.mx')) linkAmz = '';
  if (linkAmz) {
    try {
      const u = new URL(linkAmz);
      const dp = u.pathname.match(/\/dp\/([A-Z0-9]{10})/);
      if (dp) linkAmz = 'https://www.amazon.com.mx/dp/' + dp[1];
    } catch(e) {}
  }

  const specs = {};
  const specMap = [
    [/procesador|cpu|marca.*procesador/i,'procesador'],
    [/RAM|memoria.*RAM|memoria.*instalada/i,'ram'],
    [/disco|almacen|SSD|HDD|memoria.*interna/i,'almacenamiento'],
    [/pantalla|tamaño.*pant|screen.*size/i,'pantalla'],
    [/sistema.*op|SO\b|OS\b/i,'so'],
  ];
  doc.querySelectorAll('#productOverview_feature_div tr,#tech-specs-full tr,.a-normal.a-spacing-micro tr,[data-feature-name="technicalSpecifications"] tr').forEach(tr => {
    const cells = tr.querySelectorAll('td,th');
    if (cells.length < 2) return;
    const key = cells[0].textContent.trim(), val = cells[1].textContent.trim();
    for (const [re, field] of specMap) { if (re.test(key) && !specs[field]) specs[field] = val; }
  });

  const bodyText = (doc.querySelector('#feature-bullets') || {}).textContent || '';
  const gpuDedicada = /NVIDIA|GeForce|RTX|GTX|AMD Radeon RX\b/i.test(nombre + bodyText) ? 'si'
    : /Gráficos integrados|Intel UHD|Intel Iris/i.test(bodyText) ? 'no' : '';

  showImportResult({ nombre, marca, imagen, precio, estrellas, resenas, linkAmz, specs, gpuDedicada });
}

function pubAnalyze(selRows) {
  const ps = selRows.map(r => r.p);

  const ex = {};
  if (cat === 'omega3') {

      if (e.costoPorPorcion && +e.costoPorPorcion < (ex.cheapPorcVal ?? Infinity)) { ex.cheapPorc = i; ex.cheapPorcVal = +e.costoPorPorcion; }
      const epa = parseFloat(e.epa)||0, dha = parseFloat(e.dha)||0, tot = epa+dha;
      if (tot > (ex.bestEpaDhaVal || 0)) { ex.bestEpaDha = i; ex.bestEpaDhaVal = tot; }

      if (e.costoPorPorcion && +e.costoPorPorcion < (ex.cheapPorcVal ?? Infinity)) { ex.cheapPorc = i; ex.cheapPorcVal = +e.costoPorPorcion; }
      const gr = parseFloat(e.proteinaPorPorcion)||parseFloat(e.gramosPorPorcion)||0;
      if (gr > (ex.bestProtVal || 0)) { ex.bestProt = i; ex.bestProtVal = gr; }

    if (e.costoPorPorcion) parts.push('$' + e.costoPorPorcion + '/porción');
    if (e.tipoProteina) parts.push(e.tipoProteina);
  } else if (cat==='freidoras') {
    if (e.capacidad) parts.push(e.capacidad + ' L');
    if (e.potencia) parts.push(e.potencia + ' W');
    if (e.tipo) parts.push(e.tipo);
  } else if (cat==='laptops') {
    if (e.procesador) parts.push(e.procesador);
    if (e.ram) parts.push(e.ram + ' RAM');
    if (e.almacenamiento) parts.push(e.almacenamiento);
    if (e.pantalla) parts.push(e.pantalla);
  } else if (cat==='bicis') {
    if (e.tipo) parts.push(e.tipo);
    if (e.motor) parts.push('Motor: ' + e.motor);
    if (e.autonomia) parts.push('Autonomía: ' + e.autonomia);
    if (e.velocidades) parts.push(e.velocidades + ' vel.');
  } else if (cat==='microondas') {
    if (e.capacidad) parts.push(e.capacidad + ' L');
    if (e.potencia) parts.push(e.potencia + ' W');
    if (e.tipo) parts.push(e.tipo);
  } else if (cat==='magnesio') {
    if (e.formaMagnesio) parts.push(e.formaMagnesio);
    if (e.mgElemental) parts.push(e.mgElemental + ' mg elemental');
    if (e.porciones) parts.push(e.porciones + ' porciones');
    if (e.costoPorPorcion) parts.push('$' + e.costoPorPorcion + '/porción');
  } else if (cat==='creatina') {
    if (e.tipoCreatina) parts.push(e.tipoCreatina);
    if (e.grPorPorcion) parts.push(e.grPorPorcion + ' g/porción');
    if (e.porciones) parts.push(e.porciones + ' porciones');
    if (e.costoPor5g) parts.push('$' + e.costoPor5g + '/5 g');
  } else if (cat==='vitamina_d') {
    if (e.ui) parts.push(e.ui + ' UI');
    if (e.conK2) parts.push('Con K2: ' + e.conK2);
    if (e.porciones) parts.push(e.porciones + ' porciones');
    if (e.costoPorPorcion) parts.push('$' + e.costoPorPorcion + '/porción');
  } else if (cat.startsWith('tecnologia_')) {
    if (e.modelo) parts.push(e.modelo);
    if (e.bateria) parts.push('Batería: ' + e.bateria);
    if (e.potencia) parts.push(e.potencia);
  } else if (cat.startsWith('videojuegos_')) {
    if (e.plataforma) parts.push(e.plataforma);
    if (e.generacion) parts.push(e.generacion);
    if (e.almacenamiento) parts.push(e.almacenamiento);
  } else if (cat.startsWith('celulares_')) {
    if (e.chip) parts.push(e.chip);
    if (e.ram) parts.push(e.ram + ' RAM');
    if (e.almacenamiento) parts.push(e.almacenamiento);
    if (e.bateria) parts.push(e.bateria);
    if (e.hz) parts.push(e.hz);
    if (e.nfc && e.nfc === 'Sí') parts.push('NFC');
  }
  return parts.join(' · ') || null;
}

    microondas:'✅ Capacidad en litros\n✅ Potencia\n✅ Funciones (grill, convección)\n✅ Tipo de control (digital/botones)',
    magnesio:'✅ Forma de magnesio (glicinato, citrato, malato: mejor absorción)\n✅ mg de magnesio elemental por porción\n✅ Número de porciones\n✅ Costo por porción',
    creatina:'✅ Tipo (monohidrato: el más estudiado)\n✅ Gramos por porción (5 g estándar)\n✅ Pureza (sin rellenos)\n✅ Costo por 5 g',
    celulares_android:'✅ Chip y rendimiento\n✅ RAM y almacenamiento\n✅ Batería (mAh)\n✅ Pantalla (pulgadas y Hz)\n✅ NFC (pago sin contacto)',

function renderPub() {
  if (!PUB_INIT) return;
  const catsEl = $('#pub-cats');
  if (catsEl) {
    catsEl.innerHTML = Object.entries(CATS).map(([k,label]) =>
      '<button class="pub-cat-btn' + (PUB.cat===k?' on':'') + '" data-pub-cat="' + esc(k) + '">' + esc(label) + '</button>'
    ).join('');
  }
  const q = ($('#pub-q') && $('#pub-q').value || '').toLowerCase();
  const prodsEl = $('#pub-prods');
  if (prodsEl) {
    if (!PUB.cat) {
      prodsEl.innerHTML = '<div style="padding:10px 0;color:var(--fg-3);font-size:13px">Selecciona una categoría arriba para ver sus productos</div>';
    } else {
      const rows = ROWS.filter(r => r.cat===PUB.cat && r.p.activo!==false && (!q || norm(r.p.nombre+' '+(r.p.marca||'')).includes(norm(q))));
      if (!rows.length) {
        prodsEl.innerHTML = '<div style="padding:10px 0;color:var(--fg-3);font-size:13px">' + (q ? 'Sin resultados para esa búsqueda' : 'No hay productos activos en esta categoría') + '</div>';
      } else {
        prodsEl.innerHTML = rows.map(r => {
          const p = r.p, on = PUB.selIds.includes(String(p.id)), dis = !on && PUB.selIds.length>=5;
          return '<div class="pub-prod-item' + (on?' on':'') + '" data-pub-prod="' + esc(String(p.id)) + '" role="checkbox" aria-checked="' + on + '" tabindex="0"' + (dis?' style="opacity:.4;pointer-events:none"':'') + '>' +
            '<img src="' + esc(p.imagen||'') + '" alt="" onerror="this.style.display=\'none\'" loading="lazy">' +
            '<div style="flex:1;min-width:0"><div class="pname">' + esc(p.nombre) + '</div><div class="pbrand">' + esc(p.marca||'') + ' · ' + pubPriceStr(p) + '</div></div>' +
            '<div class="pck">' + (on?'✓':'') + '</div>' +
            '</div>';
        }).join('');
      }
    }
  }
  const selRow = $('#pub-sel-row'), selCount = $('#pub-sel-count');
  const selRows = pubGetSel();
  if (selRow) selRow.innerHTML = selRows.length
    ? selRows.map(r => '<span class="pub-sel-chip">' + esc(r.p.nombre) + '<button data-pub-desel="' + esc(String(r.p.id)) + '" title="Quitar">×</button></span>').join('')
    : '<span style="font-size:12px;color:var(--fg-3)">Ningún producto seleccionado</span>';
  if (selCount) selCount.textContent = selRows.length + (selRows.length===1?' seleccionado':' seleccionados');
  const tiposEl = $('#pub-tipos');
  if (tiposEl) tiposEl.innerHTML = PUB_TIPOS.map(t =>
    '<button class="pub-tipo-btn' + (PUB.tipo===t.k?' on':'') + '" data-pub-tipo="' + t.k + '">' + t.l + '<small>' + t.d + '</small></button>'
  ).join('');
  const genBtn = $('#pub-gen-btn');
  if (genBtn) genBtn.disabled = selRows.length<2 || !PUB.tipo;
  const step3 = $('#pub-step3');
  if (step3) step3.hidden = !PUB.draft;
  if (PUB.draft) { const prev = $('#pub-preview'); if(prev) prev.textContent = PUB.draft; }
  renderPubLib();
}

function renderPubLib() {
  const libEl = $('#pub-lib-list');
  if (!libEl) return;
  const lib = pubLoadLib();
  if (!lib.length) { libEl.innerHTML = '<div class="pub-empty">No hay publicaciones guardadas aún.<br>Genera una y haz clic en "Guardar borrador".</div>'; return; }
  libEl.innerHTML = lib.map(d => {
    const catLabel = CATS[d.cat]||d.cat||'—';
    const tipoLabel = (PUB_TIPOS.find(t=>t.k===d.tipo)||{}).l||d.tipo||'—';
    const date = d.fecha ? fmtShort(d.fecha) : '';
    const preview = (d.text||'').substring(0,140) + ((d.text||'').length>140?'…':'');
    return '<div class="pub-lib-item">' +
      '<div class="pub-lib-meta">' +
        '<div class="pub-lib-title">' + esc(catLabel) + ' · ' + esc(tipoLabel) + '<span class="pub-lib-badge t-muted">' + esc(date) + '</span></div>' +
        '<div class="pub-lib-sub">' + esc(preview) + '</div>' +
      '</div>' +
      '<div class="pub-lib-actions">' +
        '<button class="btn btn-sm" data-pub-lib-copy="' + d.id + '" title="Copiar texto">📋</button>' +
        '<button class="btn btn-sm" data-pub-lib-restore="' + d.id + '" title="Restaurar selección">↩</button>' +
        '<button class="btn btn-sm btn-ghost-danger" data-pub-lib-del="' + d.id + '" title="Eliminar">✕</button>' +
      '</div>' +
      '</div>';
  }).join('');
}

function initPub() {
  if (PUB_INIT) { renderPub(); return; }
  PUB_INIT = true;
  const qEl = $('#pub-q');
  if (qEl) qEl.addEventListener('input', () => renderPub());
  const imgFile = $('#pub-img-file');
  if (imgFile) imgFile.addEventListener('change', () => {
    const f = imgFile.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      PUB.imgData = ev.target.result;
      const img = $('#pub-img-preview'); if(img){img.src=PUB.imgData;img.hidden=false;}
      const rm = $('#pub-img-remove'); if(rm) rm.hidden=false;
    };
    reader.readAsDataURL(f);
  });
  renderPub();
}

function pubHandleClick(t) {
  const catBtn = t.closest('[data-pub-cat]');
  if (catBtn) { PUB.cat=catBtn.dataset.pubCat; PUB.selIds=[]; PUB.draft=null; PUB.tipo=''; renderPub(); return true; }
  const prodBtn = t.closest('[data-pub-prod]');
  if (prodBtn) {
    const id = prodBtn.dataset.pubProd;
    const idx = PUB.selIds.indexOf(id);
    if (idx>=0) PUB.selIds.splice(idx,1);
    else if (PUB.selIds.length<5) PUB.selIds.push(id);
    renderPub(); return true;
  }
  const deselBtn = t.closest('[data-pub-desel]');
  if (deselBtn) { PUB.selIds=PUB.selIds.filter(x=>x!==deselBtn.dataset.pubDesel); renderPub(); return true; }
  const tipoBtn = t.closest('[data-pub-tipo]');
  if (tipoBtn) { PUB.tipo=tipoBtn.dataset.pubTipo; renderPub(); return true; }
  const libCopy = t.closest('[data-pub-lib-copy]');
  if (libCopy) { const d=pubLoadLib().find(x=>x.id===+libCopy.dataset.pubLibCopy); if(d) copyText(d.text,'Publicación copiada'); return true; }
  const libRestore = t.closest('[data-pub-lib-restore]');
  if (libRestore) {
    const d=pubLoadLib().find(x=>x.id===+libRestore.dataset.pubLibRestore);
    if (d) { PUB.cat=d.cat||PUB.cat; PUB.selIds=d.prods||[]; PUB.tipo=d.tipo||''; PUB.draft=d.text||null; renderPub(); toast('Borrador restaurado'); }
    return true;
  }
  const libDel = t.closest('[data-pub-lib-del]');
  if (libDel) { pubDeleteDraft(+libDel.dataset.pubLibDel); renderPubLib(); toast('Borrador eliminado'); return true; }
  return false;
}

document.addEventListener('keydown', onKey);

renderAll();
renderFoot();
if (!ROWS.length) $('#empty').textContent = 'No se pudieron leer los datos de productos.';
if (restored) toast((restored === 1 ? 'Se recuperó ' : 'Se recuperaron ') + plural(restored, 'cambio sin guardar', 'cambios sin guardar') + ' de tu sesión anterior');
use('downloads').then(d => { DL = d; $('#mi-download').hidden = !d; });
})();

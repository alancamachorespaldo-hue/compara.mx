<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparar Celulares — comparalo.mx</title>
<meta name="description" content="Compara iPhone con smartphones Android de alta gama. Precios en Amazon MX y Mercado Libre.">
<link rel="canonical" href="https://comparalo.mx/celulares/comparar">
<meta name="robots" content="noindex">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400,300&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/logopng.png">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-9TKZ4ER13X"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-9TKZ4ER13X');</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--s1:#f7f7f5;--s2:#f0f0ec;--bd:#e2e2dc;
  --tx:#0F172A;--tx2:#64748b;--tx3:#94a3b8;
  --ac:#006847;--ml:#f0c000;--amz:#f90;--r:10px;
}
body{background:var(--bg);color:var(--tx);font-family:'Satoshi',sans-serif;min-height:100vh;display:flex;flex-direction:column}

/* NAV */
.nav{background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:0 2rem;display:flex;align-items:center;height:64px;gap:1rem;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;text-decoration:none}
.nav-breadcrumb{font-size:14px;color:var(--tx3);flex:1;display:flex;align-items:center;gap:4px}
.nav-breadcrumb a{color:var(--ac);text-decoration:none}
.nav-breadcrumb a:hover{text-decoration:underline}

/* MAIN */
main{flex:1;max-width:1100px;margin:0 auto;width:100%;padding:2rem}
.page-title{font-size:1.5rem;font-weight:700;letter-spacing:-.03em;margin-bottom:.25rem}
.page-sub{font-size:.88rem;color:var(--tx2);margin-bottom:2rem}

/* ACTIONS BAR */
.actions-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:1.5rem}
.btn-cat{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;text-decoration:none;border:1.5px solid var(--bd);color:var(--tx2);cursor:pointer;background:var(--bg);font-family:'Satoshi',sans-serif;transition:border-color .15s,color .15s}
.btn-cat:hover{border-color:var(--ac);color:var(--ac)}
.btn-cat.iphone{border-color:#555;color:#333}
.btn-cat.alta-gama{border-color:var(--ac);color:var(--ac)}
.btn-limpiar{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;border:1.5px solid #fca5a5;color:#ef4444;cursor:pointer;background:var(--bg);font-family:'Satoshi',sans-serif}
.btn-limpiar:hover{background:#fef2f2}
.spacer{flex:1}
.count-badge{font-size:13px;color:var(--tx2)}

/* TABLE */
.table-wrap{overflow:auto;border-radius:14px;border:1px solid var(--bd);background:var(--bg)}
.cmp-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
.cmp-table th{padding:16px 14px 14px;text-align:center;background:var(--bg);border-bottom:2px solid var(--bd);position:sticky;top:0;z-index:10;vertical-align:top;min-width:170px}
.cmp-table th:first-child{background:var(--s1);border-right:1px solid var(--bd);min-width:130px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3)}
.cmp-table tbody tr:nth-child(even) td{background:var(--s1)}
.cmp-table tbody tr:nth-child(even) td:first-child{background:var(--s2)}
.cmp-table td{padding:10px 14px;border-bottom:1px solid var(--bd);color:var(--tx);vertical-align:middle;text-align:center;font-size:12.5px;line-height:1.4}
.cmp-table tbody tr:hover td{background:rgba(0,104,71,.04)}
.cmp-table tbody tr:hover td:first-child{background:var(--s2)}
.cmp-table td:first-child{color:var(--tx2);font-size:10.5px;font-weight:700;background:var(--s1);text-transform:uppercase;letter-spacing:.06em;text-align:left;position:sticky;left:0;z-index:10;min-width:130px;max-width:130px;border-right:1px solid var(--bd);padding:10px 12px;white-space:nowrap}
.cmp-table tr:last-child td{border-bottom:none}
.cmp-winner{background:linear-gradient(135deg,#d4f0e3,#c0ebd5) !important;color:#004d34;font-weight:800}
.cmp-prod-img{width:80px;height:80px;object-fit:contain;border-radius:12px;background:var(--s1);margin:0 auto 8px;display:block;padding:6px}
.cmp-prod-name{font-size:.8rem;font-weight:700;line-height:1.3;margin-bottom:4px;color:var(--tx)}
.cmp-prod-cat{font-size:.65rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:20px;display:inline-block;margin-bottom:6px}
.cmp-prod-cat.iphone{background:#f1f5f9;color:#475569}
.cmp-prod-cat.alta-gama{background:#f0fdf4;color:#166534}
.cmp-prod-cat.smartphone{background:#eff6ff;color:#1d4ed8}
.cmp-prod-stor{font-size:.7rem;color:var(--ac);font-weight:700;margin-bottom:6px}
.cmp-prod-btns{display:grid;gap:4px;margin-top:6px}
.cmp-prod-btns.dual{grid-template-columns:1fr 1fr}
.btn-ml{background:var(--ml);color:#333}
.btn-amz{background:var(--amz);color:#333}

/* EMPTY */
.empty-state{text-align:center;padding:5rem 2rem}
.empty-icon{font-size:3rem;margin-bottom:1rem}
.empty-title{font-size:1.1rem;font-weight:700;margin-bottom:.5rem}
.empty-sub{font-size:.88rem;color:var(--tx2);margin-bottom:2rem}
.empty-links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-go{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;text-decoration:none;background:var(--ac);color:#fff}
.btn-go-sec{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;text-decoration:none;border:1.5px solid var(--ac);color:var(--ac)}

/* REMOVE BTN */
.btn-remove{background:none;border:none;cursor:pointer;color:var(--tx3);font-size:16px;line-height:1;padding:2px 4px;border-radius:4px;transition:color .15s}
.btn-remove:hover{color:#ef4444}

footer{background:var(--s1);border-top:1px solid var(--bd);padding:1.5rem 2rem;text-align:center;font-size:12px;color:var(--tx3);margin-top:auto}
footer a{color:var(--ac);text-decoration:none}

@media(max-width:640px){
  main{padding:1.25rem 1rem}
  .actions-bar{gap:6px}
  .btn-cat,.btn-limpiar{font-size:12px;padding:6px 12px}
}
</style>
</head>
<body>

<nav class="nav">
  <a class="logo" href="/">
    <img src="/logopng.png" alt="comparalo.mx" style="height:38px;width:auto;object-fit:contain">
  </a>
  <div class="nav-breadcrumb">
    <a href="/celulares">Celulares</a> › Comparativa cruzada
  </div>
</nav>

<main>
  <h1 class="page-title">Comparativa entre categorías</h1>
  <p class="page-sub">Compara iPhone con smartphones Android de alta gama lado a lado.</p>

  <div class="actions-bar">
    <a class="btn-cat iphone" href="/celulares/iphone">+ Agregar iPhone</a>
    <a class="btn-cat alta-gama" href="/celularesalta-gama">+ Agregar Alta Gama</a>
    <div class="spacer"></div>
    <span class="count-badge" id="count-badge"></span>
    <button class="btn-limpiar" onclick="limpiarTodo()">Limpiar todo</button>
  </div>

  <div id="content"></div>
</main>

<footer>
  © 2026 · <a href="/">comparalo.mx</a> · Sitio de afiliados · <a href="/celulares">Celulares</a>
</footer>

<script>
const KEY = 'cmp_celulares';

function fmt(n) {
  return n != null ? '$' + Number(n).toLocaleString('es-MX', {minimumFractionDigits: 0, maximumFractionDigits: 0}) : '—';
}
function storageLbl(gb) {
  return gb >= 1000 ? (gb / 1024) + ' TB' : gb + ' GB';
}
function catLabel(cat) {
  const map = { iphone: 'iPhone', 'alta-gama': 'Alta Gama', smartphone: 'Smartphone' };
  return map[cat] || cat;
}

function prodBtns(item, size) {
  const h = size === 'sm' ? '16px' : '18px';
  const pad = size === 'sm' ? '5px 8px' : '7px 12px';
  const fs = size === 'sm' ? '11px' : '12px';
  const ml = item.linkML  ? `<a class="btn-ml"  href="${item.linkML}"  target="_blank" rel="sponsored nofollow noopener" style="display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:${pad};border-radius:8px;font-size:${fs};font-weight:700;text-decoration:none;">Ver en <img style="height:${h}" src="/logomercado.png" onerror="this.style.display='none'"></a>` : '';
  const amz = item.linkAmz ? `<a class="btn-amz" href="${item.linkAmz}" target="_blank" rel="sponsored nofollow noopener" style="display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:${pad};border-radius:8px;font-size:${fs};font-weight:700;text-decoration:none;">Ver en <img style="height:${h}" src="/logoamazon.png" onerror="this.style.display='none'"></a>` : '';
  const dual = ml && amz ? ' dual' : '';
  return `<div class="cmp-prod-btns${dual}">${ml}${amz}</div>`;
}

function fila(label, rawVals, fmtFn, best) {
  const nums = rawVals.map(v => (v !== null && v !== undefined && typeof v === 'number' && !isNaN(v)) ? v : null);
  let winner = null;
  if (best === 'max') { const val = nums.filter(n => n !== null); if (val.length > 1) winner = Math.max(...val); }
  if (best === 'min') { const val = nums.filter(n => n !== null && n > 0); if (val.length > 1) winner = Math.min(...val); }
  const cells = rawVals.map((v, i) => {
    const isWin = winner !== null && nums[i] === winner;
    const display = (v !== null && v !== undefined) ? fmtFn(v) : '—';
    return `<td class="${isWin ? 'cmp-winner' : ''}">${display}</td>`;
  }).join('');
  return `<tr><td>${label}</td>${cells}</tr>`;
}

function render() {
  let items;
  try { items = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { items = []; }

  const content = document.getElementById('content');
  const badge = document.getElementById('count-badge');

  if (!items.length) {
    badge.textContent = '';
    content.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📱</div>
        <div class="empty-title">Sin productos para comparar</div>
        <div class="empty-sub">Selecciona productos en cualquier categoría y usa el botón "↗ Con otras categorías"</div>
        <div class="empty-links">
          <a class="btn-go" href="/celulares/iphone">Ver iPhone →</a>
          <a class="btn-go-sec" href="/celularesalta-gama">Ver Alta Gama →</a>
        </div>
      </div>`;
    return;
  }

  badge.textContent = `${items.length} producto${items.length !== 1 ? 's' : ''} en comparativa`;

  const headers = items.map((item, idx) => `
    <th>
      <button class="btn-remove" onclick="removeItem(${idx})" title="Quitar">✕</button>
      <img class="cmp-prod-img" src="${item.img || ''}" alt="${item.nombre}" onerror="this.style.opacity='.2'">
      <div class="cmp-prod-name">${item.nombre}</div>
      <span class="cmp-prod-cat ${item.categoria}">${catLabel(item.categoria)}</span>
      <div class="cmp-prod-stor">${storageLbl(item.almacenamiento)}${item.ram ? ' · ' + item.ram + ' GB RAM' : ''}</div>
      ${prodBtns(item, 'sm')}
    </th>`).join('');

  const prices = items.map(i => i.precio || null);
  const minP = Math.min(...prices.filter(Boolean));
  const precioRow = `<tr><td>Precio</td>${items.map(i =>
    `<td class="${i.precio === minP ? 'cmp-winner' : ''}">${fmt(i.precio)}</td>`
  ).join('')}</tr>`;

  const valorRow = `<tr><td>Valoración</td>${items.map(i =>
    `<td>${i.estrellas ? `<span style="color:#e6900a;font-weight:700">★ ${Number(i.estrellas).toFixed(1)}</span> <span style="font-size:11px;color:var(--tx3)">(${(i.resenas||0).toLocaleString('es-MX')})</span>` : '—'}</td>`
  ).join('')}</tr>`;

  const chipRow = `<tr><td>Chip</td>${items.map(i =>
    `<td>${i.chip || '—'}</td>`
  ).join('')}</tr>`;

  const rows = [
    precioRow,
    fila('Almacenamiento',         items.map(i => i.almacenamiento), v => storageLbl(v), 'max'),
    fila('RAM',                    items.map(i => i.ram),            v => v + ' GB',     'max'),
    chipRow,
    fila('Cámara',                 items.map(i => i.camPrincipal),   v => v + ' MP',     'max'),
    fila('Pantalla',               items.map(i => i.pantalla),       v => v + '"',       'max'),
    fila('Frecuencia de pantalla', items.map(i => i.hz),             v => v + ' Hz',     'max'),
    fila('USB',                    items.map(i => i.usb),            v => 'USB ' + v,    'max'),
    fila('Zoom óptico',            items.map(i => i.zoom),           v => v + '×',       'max'),
    valorRow,
  ].join('');

  const btnRows = items.map(i => `<td>${prodBtns(i, 'md')}</td>`).join('');

  content.innerHTML = `
    <div class="table-wrap">
      <table class="cmp-table">
        <thead>
          <tr>
            <th>Característica</th>
            ${headers}
          </tr>
        </thead>
        <tbody>
          ${rows}
          <tr><td>Comprar</td>${btnRows}</tr>
        </tbody>
      </table>
    </div>`;
}

function removeItem(idx) {
  let items;
  try { items = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { items = []; }
  items.splice(idx, 1);
  localStorage.setItem(KEY, JSON.stringify(items));
  render();
}

function limpiarTodo() {
  localStorage.removeItem(KEY);
  render();
}

render();
</script>
</body>
</html>

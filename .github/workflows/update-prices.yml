name: Actualizar precios Mercado Libre

# El único workflow de precios programado. Revisa todas las categorías registradas en
# el registro scripts/categorias.js, revisa que sigan existiendo en ML, regenera
# descuentos, bajadas, histórico y los
# catálogos mini, y actualiza los precios escritos en las guías. Una categoría nueva entra
# aquí sola con registrarla en scripts/categorias.js (una guía nueva, en GUIAS de
# sync-guias-precios.js).
# ml-update.yml hacía lo mismo cuatro horas antes y se retiró el 16-nov-2026.

on:
  schedule:
    # Cada día a las 6:00 AM hora Ciudad de México (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      categoria:
        description: 'Categoría a actualizar'
        type: choice
        default: all
        options: [all, laptops, freidoras, bicis, bicisMontana, bicisMontanaDed, bicisRuta, bicisGravel, microondas, cafeteras, suplementos, proteina, omega3, magnesio, creatina, complejo_b, vitamina_d, videojuegos_consolas, videojuegos_controles, videojuegos_juegos, tecnologia_bocinas, tecnologia_audifonos, tecnologia_smartwatches, celulares_android, celulares_iphone, streaming, refrigeradores, lavadoras, ollas]


# Un solo workflow de datos a la vez. Los siete escriben scripts/merged-admin.json y, cuando dos
# se traslapan, el segundo se encuentra el commit del primero a medio camino: así nació el
# incidente del 16-nov-2026 (1,065 bloques de conflicto confirmados en la base). Con
# cancel-in-progress en false, el que llega después espera su turno en vez de pisar al otro.
concurrency:
  group: datos-comparalo
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: el paso final hace rebase contra origin/main y con un
          # clon superficial no habría base común sobre la cual rebasar.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm install

      - name: Actualizar precios ML por ID de catálogo
        env:
          ML_CLIENT_ID:     ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          CATEGORIA:        ${{ inputs.categoria || 'all' }}
        run: node scripts/ml-update.js --categoria="$CATEGORIA"

      - name: Anotar qué productos están publicados en cada página
        run: node scripts/marcar-publicados.js

      - name: Revisar disponibilidad en ML y pausar lo caído
        env:
          ML_CLIENT_ID:     ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
        # Siempre revisa TODO el sitio, aunque la corrida sea de una sola categoría: son ~2 min
        # y es lo que evita seguir anunciando productos que ya no existen. Capa 1 (catálogo);
        # la capa de links, más lenta, va en el workflow semanal revisar-disponibilidad.yml.
        # Un producto se pausa cuando se ve caído en DOS corridas seguidas (umbral por defecto),
        # y se reactiva solo si vuelve a estar disponible.
        run: node scripts/revisar-disponibilidad.js --todas --aplicar

      - name: Sincronizar merged-admin.json y regenerar artifact
        run: node scripts/generar-admin.js

      - name: Registrar el precio de hoy en el histórico
        run: node scripts/historico-precios.js

      - name: Publicar el histórico de 30 días por categoría
        run: node scripts/generar-historico.js

      - name: Generar los catálogos mini de las guías (celulares y cafeteras)
        run: node scripts/generar-catalog-mini.js

      - name: Generar descuentos del día (celulares)
        run: node scripts/generar-descuentos.js

      - name: Generar descuentos del día (proteínas)
        run: node scripts/generar-proteina-descuentos.js

      - name: Generar descuentos del día (laptops)
        run: node scripts/generar-laptops-descuentos.js

      - name: Generar descuentos del día (creatina)
        run: node scripts/generar-creatina-descuentos.js

      - name: Generar descuentos del día (cafeteras)
        run: node scripts/generar-cafeteras-descuentos.js

      - name: Generar descuentos del día (bicis, freidoras, microondas, omega3, magnesio, complejo B, vitamina D, videojuegos, tecnología)
        run: node scripts/generar-ofertas-categoria.js --todas

      - name: Generar bajadas de precio por categoría (filtro "Bajó de precio")
        run: node scripts/generar-bajadas.js

      - name: Aplicar pausas a páginas HTML
        run: node scripts/sync-pausas.js

      - name: Cuadrar los contadores de los hubs con lo que se ve
        run: node scripts/sync-hub-counts.js

      - name: Aplicar precios de Amazon y pausas/eliminados a subpáginas de suplementos
        run: node scripts/sync-suplementos-precios.js --aplicar

      - name: Actualizar los precios escritos en las guías
        run: node scripts/sync-guias-precios.js --aplicar

      - name: Armar la página de ofertas (/ofertas/)
        run: node scripts/generar-ofertas.js

      - name: Sustituir fotos de portada que ya no existen (listados)
        continue-on-error: true
        run: node scripts/sync-hero-imgs.js

      - name: Revisar el sitio
        run: node scripts/check-site.js

      - name: Revisar que los datos estén sanos
        run: node scripts/validar-datos.js

      - name: Commit y push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -u confirma todo lo versionado que hayan tocado los pasos de arriba, sin enumerar
          # rutas. Antes era una lista escrita a mano de medio centenar de archivos y cada
          # página o guía nueva tenía que agregarse ahí: si se olvidaba, sus precios nuevos se
          # descartaban en silencio en cada corrida (pasó con tres guías hasta el 16-nov-2026).
          # Es -u y no -A a propósito: nunca confirma archivos sueltos sin versionar, y antes
          # de llegar aquí ya corrieron check-site.js y validar-datos.js.
          git add -u
          if git diff --staged --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "chore(precios): actualizar precios ML $(date +'%Y-%m-%d')"
          # Se trae lo que haya entrado mientras corría el job. No se usa stash: el árbol ya
          # está limpio porque todo lo generado quedó en el commit. Si el rebase choca, se
          # aborta y el workflow falla a la vista, en lugar de confirmar un archivo con
          # marcas de conflicto como pasó el 16-nov-2026.
          for intento in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::El rebase chocó con otro commit del remoto. No se publica nada; revísalo a mano."
              exit 1
            fi
            node scripts/validar-datos.js || exit 1
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rechazado (intento $intento de 3); vuelvo a traer el remoto."
          done
          echo "::error::No se pudo publicar después de 3 intentos."
          exit 1

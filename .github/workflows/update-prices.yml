name: Actualizar precios Mercado Libre

on:
  schedule:
    # Corre cada día a las 6:00 AM hora Ciudad de México (UTC-6 → 12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch: # permite lanzarlo manualmente

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Obtener token de Mercado Libre
        id: get_token
        run: |
          RESPONSE=$(curl -s -X POST "https://api.mercadolibre.com/oauth/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=${{ secrets.ML_CLIENT_ID }}&client_secret=${{ secrets.ML_CLIENT_SECRET }}")
          TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$TOKEN" ]; then
            echo "Error obteniendo token: $RESPONSE"
            exit 1
          fi
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Actualizar precios buscando por nombre en ML México
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import urllib.parse
          import json
          import re

          TOKEN = "${{ steps.get_token.outputs.token }}"

          with open("creatina.html", "r", encoding="utf-8") as f:
            html = f.read()

          # Extraer pares nombre→linkML del HTML
          pairs = re.findall(r'nombre:"([^"]+)"[^}]{0,200}?linkML:"(https://meli\.la/[^"]+)"', html, re.DOTALL)
          print(f"Productos encontrados: {len(pairs)}")

          prices_by_link = {}
          headers = {"Authorization": f"Bearer {TOKEN}"}

          for nombre, link in pairs:
            query = urllib.parse.quote(nombre)
            url = f"https://api.mercadolibre.com/sites/MLM/search?q={query}&limit=1&attributes=results.id,results.price,results.title"
            req = urllib.request.Request(url, headers=headers)
            try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                data = json.loads(resp.read())
                results = data.get("results", [])
                if results:
                  price = results[0].get("price")
                  found_title = results[0].get("title", "")
                  if price is not None:
                    prices_by_link[link] = price
                    print(f"OK  {nombre[:50]} → ${price:,.0f} [{found_title[:40]}]")
                  else:
                    print(f"SIN PRECIO: {nombre[:50]}")
                else:
                  print(f"SIN RESULTADO: {nombre[:50]}")
            except Exception as e:
              print(f"ERROR {nombre[:40]}: {e}")

          print(f"\nPrecios obtenidos: {len(prices_by_link)} de {len(pairs)}")

          if not prices_by_link:
            print("Sin precios. Abortando.")
            exit(0)

          updated = 0
          for link, price in prices_by_link.items():
            old = html
            html = re.sub(
              rf'(linkML:"{re.escape(link)}"[^}}]{{0,400}}?)data-price:"[^"]*"',
              rf'\1data-price:"{price}"',
              html,
              flags=re.DOTALL
            )
            if html != old:
              updated += 1

          with open("creatina.html", "w", encoding="utf-8") as f:
            f.write(html)

          print(f"Precios actualizados en HTML: {updated}")
          PYEOF

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add creatina.html
          if git diff --staged --quiet; then
            echo "Sin cambios de precios, nada que commitear."
          else
            git commit -m "chore: actualizar precios ML $(date +'%Y-%m-%d')"
            git push
          fi

name: Actualizar precios Mercado Libre

on:
  schedule:
    # Cada día a las 6:00 AM hora Ciudad de México (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      categoria:
        description: 'Categoría a actualizar'
        type: choice
        default: all
        options: [all, laptops, freidoras, bicis, bicisMontana, bicisMontanaDed, microondas, cafeteras, suplementos, proteina, omega3, magnesio, creatina, complejo_b, videojuegos_consolas, videojuegos_controles, videojuegos_juegos, tecnologia_bocinas, tecnologia_audifonos, tecnologia_smartwatches, celulares_android, celulares_iphone, streaming, refrigeradores, lavadoras, ollas]


# Un solo workflow de datos a la vez. Los ocho escriben scripts/merged-admin.json y, cuando dos
# se traslapan, el segundo se encuentra el commit del primero a medio camino: así nació el
# incidente del 16-nov-2026 (1,065 bloques de conflicto confirmados en la base). Con
# cancel-in-progress en false, el que llega después espera su turno en vez de pisar al otro.
concurrency:
  group: datos-comparalo
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: el paso final hace rebase contra origin/main y con un
          # clon superficial no habría base común sobre la cual rebasar.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm install

      - name: Actualizar precios ML por ID de catálogo
        env:
          ML_CLIENT_ID:     ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          CATEGORIA:        ${{ inputs.categoria || 'all' }}
        run: node scripts/ml-update.js --categoria="$CATEGORIA"

      - name: Sincronizar merged-admin.json y regenerar artifact
        run: node scripts/generar-admin.js

      - name: Registrar el precio de hoy en el histórico
        run: node scripts/historico-precios.js

      - name: Publicar el histórico de 30 días por categoría
        run: node scripts/generar-historico.js

      - name: Generar los catálogos mini de las guías (celulares y cafeteras)
        run: node scripts/generar-catalog-mini.js

      - name: Generar descuentos del día (celulares)
        run: node scripts/generar-descuentos.js

      - name: Generar descuentos del día (proteínas)
        run: node scripts/generar-proteina-descuentos.js

      - name: Generar descuentos del día (laptops)
        run: node scripts/generar-laptops-descuentos.js

      - name: Generar descuentos del día (creatina)
        run: node scripts/generar-creatina-descuentos.js

      - name: Generar descuentos del día (cafeteras)
        run: node scripts/generar-cafeteras-descuentos.js

      - name: Generar descuentos del día (bicis, freidoras, microondas, omega3, magnesio, complejo B, vitamina D, videojuegos, tecnología)
        run: node scripts/generar-ofertas-categoria.js --todas

      - name: Generar bajadas de precio por categoría (filtro "Bajó de precio")
        run: node scripts/generar-bajadas.js

      - name: Aplicar pausas a páginas HTML
        run: node scripts/sync-pausas.js

      - name: Aplicar precios de Amazon y pausas/eliminados a subpáginas de suplementos
        run: node scripts/sync-suplementos-precios.js --aplicar

      - name: Actualizar los precios escritos en las guías
        run: node scripts/sync-guias-precios.js --aplicar

      - name: Sustituir fotos de portada que ya no existen (listados)
        continue-on-error: true
        run: node scripts/sync-hero-imgs.js

      - name: Revisar el sitio
        run: node scripts/check-site.js

      - name: Revisar que los datos estén sanos
        run: node scripts/validar-datos.js

      - name: Commit y push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add laptops/index.html bicis/index.html bicicletas/bici-montana/index.html entretenimiento/streaming/index.html \
            electrodomesticos/freidoras/index.html electrodomesticos/microondas/index.html \
            electrodomesticos/cafeteras/index.html \
            electrodomesticos/refrigeradores/index.html electrodomesticos/lavadoras/index.html electrodomesticos/ollas/index.html \
            suplementos/proteina/index.html suplementos/omega3/index.html suplementos/magnesio/index.html \
            suplementos/creatina/index.html suplementos/complejo-b/index.html \
            videojuegos/consolas/index.html videojuegos/controles/index.html videojuegos/juegos/index.html \
            tecnologia/bocinas/index.html tecnologia/audifonos/index.html tecnologia/smartwatches/index.html \
            celulares/android/index.html celulares/iphone/index.html suplementos/vitamina-d/index.html \
            celulares/catalog-mini.json celulares/descuentos.json electrodomesticos/cafeteras/catalog-mini.json \
            suplementos/proteina/descuentos.json laptops/descuentos.json suplementos/creatina/descuentos.json \
            electrodomesticos/cafeteras/descuentos.json \
            bicis/descuentos.json electrodomesticos/freidoras/descuentos.json electrodomesticos/microondas/descuentos.json \
            suplementos/omega3/descuentos.json suplementos/magnesio/descuentos.json suplementos/complejo-b/descuentos.json \
            suplementos/vitamina-d/descuentos.json \
            videojuegos/consolas/descuentos.json videojuegos/controles/descuentos.json videojuegos/juegos/descuentos.json \
            tecnologia/bocinas/descuentos.json tecnologia/audifonos/descuentos.json tecnologia/smartwatches/descuentos.json \
            entretenimiento/streaming/descuentos.json \
            electrodomesticos/refrigeradores/descuentos.json electrodomesticos/lavadoras/descuentos.json \
            assets/data/bajadas.json assets/data/historico scripts/historico-precios.json \
            guias/cafeteras/espresso-menos-2000/index.html guias/celulares/mejores-celulares-menos-5000/index.html \
            guias/celulares/celulares-menos-3000-mexico/index.html guias/celulares/mejores-celulares-calidad-precio/index.html \
            suplementos/creatina/catalog-mini.json suplementos/creatina/creatina-mexico-cual-comprar/index.html \
            scripts/guias-precios-report.json \
            scripts/ml-report.json scripts/merged-admin.json scripts/admin-artifact.html
          if git diff --staged --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "chore(precios): actualizar precios ML $(date +'%Y-%m-%d')"
          # Se trae lo que haya entrado mientras corría el job. No se usa stash: el árbol ya
          # está limpio porque todo lo generado quedó en el commit. Si el rebase choca, se
          # aborta y el workflow falla a la vista, en lugar de confirmar un archivo con
          # marcas de conflicto como pasó el 16-nov-2026.
          for intento in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::El rebase chocó con otro commit del remoto. No se publica nada; revísalo a mano."
              exit 1
            fi
            node scripts/validar-datos.js || exit 1
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rechazado (intento $intento de 3); vuelvo a traer el remoto."
          done
          echo "::error::No se pudo publicar después de 3 intentos."
          exit 1

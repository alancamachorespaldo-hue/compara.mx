name: Actualizar precios Mercado Libre

on:
  schedule:
    # Cada día a las 6:00 AM hora Ciudad de México (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      categoria:
        description: 'Categoría a actualizar'
        type: choice
        default: all
        options: [all, laptops, freidoras, bicis, microondas, cafeteras, suplementos, proteina, omega3, magnesio, creatina, complejo_b, videojuegos_consolas, videojuegos_controles, videojuegos_juegos, tecnologia_bocinas, tecnologia_audifonos, celulares_android]

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm install

      - name: Actualizar precios ML por ID de catálogo
        env:
          ML_CLIENT_ID:     ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          CATEGORIA:        ${{ inputs.categoria || 'all' }}
        run: node scripts/ml-update.js --categoria="$CATEGORIA"

      - name: Sincronizar merged-admin.json y regenerar artifact
        run: node scripts/generar-admin.js

      - name: Generar catálogo mini de celulares
        run: node scripts/generar-catalog-mini.js

      - name: Generar descuentos del día (celulares)
        run: node scripts/generar-descuentos.js

      - name: Generar descuentos del día (proteínas)
        run: node scripts/generar-proteina-descuentos.js

      - name: Generar descuentos del día (laptops)
        run: node scripts/generar-laptops-descuentos.js

      - name: Generar descuentos del día (cafeteras)
        run: node scripts/generar-cafeteras-descuentos.js

      - name: Aplicar pausas a páginas HTML
        run: node scripts/sync-pausas.js

      - name: Revisar el sitio
        run: node scripts/check-site.js

      - name: Commit y push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add laptops/index.html bicis/index.html \
            electrodomesticos/freidoras/index.html electrodomesticos/microondas/index.html \
            electrodomesticos/cafeteras/index.html \
            suplementos/proteina/index.html suplementos/omega3/index.html suplementos/magnesio/index.html \
            suplementos/creatina/index.html suplementos/complejo-b/index.html \
            videojuegos/consolas/index.html videojuegos/controles/index.html videojuegos/juegos/index.html \
            tecnologia/bocinas/index.html tecnologia/audifonos/index.html \
            celulares/android/index.html suplementos/vitamina-d/index.html \
            celulares/catalog-mini.json celulares/descuentos.json \
            suplementos/proteina/descuentos.json laptops/descuentos.json \
            electrodomesticos/cafeteras/descuentos.json \
            scripts/ml-report.json scripts/merged-admin.json scripts/admin-artifact.html
          if git diff --staged --quiet; then
            echo "Sin cambios de precios."
          else
            git commit -m "chore(precios): actualizar precios ML $(date +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi

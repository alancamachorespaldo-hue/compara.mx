name: ✅ Chequeo del sitio

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar páginas (GA4, onboarding, tag afiliado, links, sintaxis)
        run: node scripts/check-site.js

      # Cualquier push, venga de donde venga: si un JSON de datos trae marcas de conflicto
      # o dejó de ser legible, que se vea aquí y no tres días después.
      - name: Validar los datos (marcas de conflicto, JSON legible)
        run: node scripts/validar-datos.js

name: 🚲 Actualizar precios — Bicis

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm install

      - name: Actualizar precios ML
        env:
          ML_CLIENT_ID:     ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
        run: node scripts/ml-update.js --categoria=bicis

      - name: Sincronizar merged-admin.json y regenerar artifact
        run: node scripts/generar-admin.js

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bicis/index.html scripts/ml-report.json scripts/merged-admin.json scripts/admin-artifact.html
          if git diff --staged --quiet; then
            echo "Sin cambios de precios."
          else
            git commit -m "chore(precios): actualizar bicis ML $(date +'%Y-%m-%d')"
            git push
          fi
